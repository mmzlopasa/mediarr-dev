        city: { type: string }
        state: { type: string }
        country: { type: string }
        id: { type: string, format: uuid }
        originalName: { type: string }
        kind: { type: string, enum: [unknown, photo, video] }
        status: { type: string, enum: [processing, ready, failed] }
