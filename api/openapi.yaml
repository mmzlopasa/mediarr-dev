components:
  responses:
    Error:
      description: The request failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    VaultStatus:
      type: object
      required: [hasPin, unlocked]
      properties:
        hasPin: { type: boolean }
        unlocked: { type: boolean }
    VaultPinChange:
      type: object
      required: [pin]
      properties:
        pin: { type: string }
        currentPin: { type: string }
    VaultUnlock:
      type: object
      required: [pin]
      properties:
        pin: { type: string }
    VaultSession:
      type: object
      required: [token]
      properties:
        token: { type: string }
    Tag:
      type: object
      required: [id, name, assetCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        assetCount: { type: integer, format: int64 }
    AssetTagChange:
      type: object
      required: [ids, name]
      properties:
        ids: { type: array, items: { type: string, format: uuid } }
        name: { type: string }
        remove: { type: boolean, default: false }
    UserRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    AlbumRules:
      type: object
      description: "Conditions that must all hold. Rules for people, places and tags arrive with those features."
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        kind: { type: string, enum: [photo, video, live] }
        camera: { type: string }
    AlbumMember:
      type: object
      required: [userId, name, role]
      properties:
        userId: { type: string, format: uuid }
        name: { type: string }
        role: { type: string, enum: [viewer, contributor, editor] }
    Album:
      type: object
      required: [id, title, description, role, ownerId, ownerName, assetCount, order, isSmart, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        role: { type: string, enum: [owner, editor, contributor, viewer] }
        ownerId: { type: string, format: uuid }
        ownerName: { type: string }
        assetCount: { type: integer, format: int64 }
        coverAssetId: { type: string, format: uuid }
        order: { type: string, enum: [newest, oldest] }
        isSmart: { type: boolean }
        rules: { $ref: "#/components/schemas/AlbumRules" }
        members: { type: array, items: { $ref: "#/components/schemas/AlbumMember" } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AlbumCreate:
      type: object
      required: [title]
      properties:
        title: { type: string }
        description: { type: string }
        rules: { $ref: "#/components/schemas/AlbumRules" }
    AlbumUpdate:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        coverAssetId: { type: string, format: uuid }
        order: { type: string, enum: [newest, oldest] }
        rules: { $ref: "#/components/schemas/AlbumRules" }
    AssetIds:
      type: object
      required: [ids]
      properties:
        ids: { type: array, items: { type: string, format: uuid } }
    MemberRole:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [viewer, contributor, editor] }
    Comment:
      type: object
      required: [id, userId, userName, body, createdAt, canDelete]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        userName: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        canDelete: { type: boolean }
    Activity:
      type: object
      required: [comments, hearts, hearted]
      properties:
        comments: { type: array, items: { $ref: "#/components/schemas/Comment" } }
        hearts: { type: integer, format: int64 }
        hearted: { type: boolean }
    CommentCreate:
      type: object
      required: [body]
      properties:
        body: { type: string }
        assetId: { type: string, format: uuid }
    ShareLink:
      type: object
      required: [id, label, hasPassword, downloadCount, allowDownload, allowUpload, uploadOnly, showLocation, createdAt]
      properties:
        id: { type: string, format: uuid }
        token: { type: string, description: Returned only when the link is created }
        label: { type: string }
        hasPassword: { type: boolean }
        expiresAt: { type: string, format: date-time }
        downloadLimit: { type: integer }
        downloadCount: { type: integer }
        allowDownload: { type: boolean }
        allowUpload: { type: boolean }
        uploadOnly: { type: boolean }
        showLocation: { type: boolean }
        watermark: { type: string }
        createdAt: { type: string, format: date-time }
    ShareLinkCreate:
      type: object
      properties:
        label: { type: string }
        password: { type: string }
        expiresAt: { type: string, format: date-time }
        downloadLimit: { type: integer, minimum: 1 }
        allowDownload: { type: boolean, default: true }
        allowUpload: { type: boolean, default: false }
        uploadOnly: { type: boolean, default: false }
        showLocation: { type: boolean, default: false }
        watermark: { type: string }
    PublicLink:
      type: object
      required: [locked, allowDownload, allowUpload, uploadOnly, watermarked]
      properties:
        locked: { type: boolean, description: A password is needed first. Nothing else is told until then. }
        title: { type: string }
        description: { type: string }
        allowDownload: { type: boolean }
        allowUpload: { type: boolean }
        uploadOnly: { type: boolean }
        watermarked: { type: boolean }
    LinkPassword:
      type: object
      required: [password]
      properties:
        password: { type: string }
    PartnerEntry:
      type: object
      required: [userId, name, inTimeline]
      properties:
        userId: { type: string, format: uuid }
        name: { type: string }
        since: { type: string, format: date }
        inTimeline: { type: boolean }
    Partners:
      type: object
      required: [given, received]
      properties:
        given: { type: array, items: { $ref: "#/components/schemas/PartnerEntry" } }
        received: { type: array, items: { $ref: "#/components/schemas/PartnerEntry" } }
    PartnerShare:
      type: object
      properties:
        since: { type: string, format: date }
    PartnerTimeline:
      type: object
      required: [show]
      properties:
        show: { type: boolean }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, unavailable] }
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
    LoginError:
      type: object
      required: [message, totpRequired]
      properties:
        message: { type: string }
        totpRequired: { type: boolean }
    AuthStatus:
      type: object
      required: [setupRequired]
      properties:
        setupRequired: { type: boolean }
        user: { $ref: "#/components/schemas/User" }
    User:
      type: object
      required: [id, email, name, isAdmin, totpEnabled]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        isAdmin: { type: boolean }
        totpEnabled: { type: boolean }
    SetupRequest:
      type: object
      required: [email, name, password]
      properties:
        email: { type: string }
        name: { type: string }
        password: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
        totpCode: { type: string }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string }
    CreateUserRequest:
      type: object
      required: [email, name, password, isAdmin]
      properties:
        email: { type: string }
        name: { type: string }
        password: { type: string }
        isAdmin: { type: boolean }
    CreateDeviceKeyRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
    DeviceKey:
      type: object
      required: [id, key]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
    TotpSetup:
      type: object
      required: [secret, uri]
      properties:
        secret: { type: string }
        uri: { type: string }
    TotpCode:
      type: object
      required: [code]
      properties:
        code: { type: string }
    PasswordConfirm:
      type: object
      required: [password]
      properties:
        password: { type: string }
    AdminOverview:
      type: object
      required: [users, photos, videos, processing, failed, libraryBytes, diskTotalBytes, diskFreeBytes, jobs, version, databaseVersion]
      properties:
        users: { type: integer, format: int64 }
        photos: { type: integer, format: int64 }
        videos: { type: integer, format: int64 }
        processing: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
        libraryBytes: { type: integer, format: int64, description: Total size of all originals }
        diskTotalBytes: { type: integer, format: int64 }
        diskFreeBytes: { type: integer, format: int64 }
        jobs:
          type: object
          required: [queued, running, completed, failed]
          properties:
            queued: { type: integer, format: int64 }
            running: { type: integer, format: int64 }
            completed: { type: integer, format: int64 }
            failed: { type: integer, format: int64 }
        version: { type: string }
        databaseVersion: { type: string }
    Asset:
      type: object
      required: [id, originalName, kind, status, sizeBytes, checksum, createdAt]
      properties:
        id: { type: string, format: uuid }
        originalName: { type: string }
        kind: { type: string, enum: [unknown, photo, video] }
        status: { type: string, enum: [processing, ready, failed] }
        error: { type: string }
        sizeBytes: { type: integer, format: int64 }
        checksum: { type: string, description: Lowercase hex SHA-256 }
        width: { type: integer }
        height: { type: integer }
        blurhash: { type: string }
        takenAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    TimelineBuckets:
      type: object
      required: [buckets]
      properties:
        buckets:
          type: array
          items:
            type: object
            required: [month, count]
            properties:
              month: { type: string }
              count: { type: integer, format: int64 }
    TimelineItem:
      type: object
      required: [id, kind, ratio, isFavorite, localAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [unknown, photo, video] }
        ratio: { type: number, format: float, description: "Width divided by height, as displayed" }
        blurhash: { type: string }
        isFavorite: { type: boolean }
        isLive: { type: boolean }
        isShared: { type: boolean, description: "Belongs to someone else, shared with this user" }
        durationMs: { type: integer, format: int64 }
        localAt: { type: string, description: "Local capture time without a zone: 2006-01-02T15:04:05" }
    TimelineBucket:
      type: object
      required: [month, items]
      properties:
        month: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/TimelineItem" }
    AssetDetail:
      type: object
      required: [id, originalName, kind, status, sizeBytes, isFavorite, isArchived, localAt, createdAt]
      properties:
        isOwner: { type: boolean, description: "Only the owner can change or delete the asset" }
        downloadAllowed: { type: boolean, description: "False on a public link that does not allow downloads" }
        tags: { type: array, items: { type: string }, description: "Only for the owner" }
        id: { type: string, format: uuid }
        originalName: { type: string }
        kind: { type: string, enum: [unknown, photo, video] }
        status: { type: string, enum: [processing, ready, failed] }
        mimeType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        width: { type: integer }
        height: { type: integer }
        isFavorite: { type: boolean }
        isArchived: { type: boolean }
        localAt: { type: string }
        offsetMinutes: { type: integer }
        hasCaptureTime: { type: boolean }
        createdAt: { type: string, format: date-time }
        newerId: { type: string, format: uuid }
        olderId: { type: string, format: uuid }
        durationMs: { type: integer, format: int64 }
        videoCodec: { type: string }
        hlsReady: { type: boolean, description: "The adaptive stream at video/master.m3u8 can be played" }
        liveVideoId: { type: string, format: uuid, description: The video of a Live Photo }
        hasMotion: { type: boolean, description: "An Android Motion Photo, with its video at /motion" }
        sprite: { $ref: "#/components/schemas/Sprite" }
        camera: { type: string }
        lens: { type: string }
        iso: { type: integer }
        fNumber: { type: number, format: double }
        exposureTime: { type: string }
        focalLength: { type: number, format: double }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
    Sprite:
      type: object
      required: [columns, rows, count, intervalMs]
      properties:
        columns: { type: integer }
        rows: { type: integer }
        count: { type: integer }
        intervalMs: { type: integer }
    BulkRequest:
      type: object
      required: [ids, action]
      properties:
        ids:
          type: array
          maxItems: 1000
          items: { type: string, format: uuid }
        action: { type: string, enum: [favorite, unfavorite, archive, unarchive, delete, restore, vault, unvault, purge] }
    BulkResponse:
      type: object
      required: [changed]
      properties:
        changed: { type: integer, format: int64 }
    AssetList:
      type: object
      required: [items, total, processing, failed]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Asset" }
        total: { type: integer, format: int64 }
        processing: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
    ChecksumCheckRequest:
      type: object
      required: [checksums]
      properties:
        checksums:
          type: array
          maxItems: 1000
          items: { type: string }
    ChecksumCheckResponse:
      type: object
      required: [existing]
      properties:
        existing:
          type: array
          items: { type: string }
