components:
  responses:
    Error:
      description: The request failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Duplicates:
      type: object
      required: [groups, total, pending]
      properties:
        total: { type: integer, description: "All groups, of which at most the first 100 are listed" }
        pending: { type: integer, description: "Photos not compared yet" }
        groups:
          type: array
          items: { $ref: "#/components/schemas/DuplicateGroup" }
    DuplicateGroup:
      type: object
      required: [items, keepId]
      properties:
        keepId: { type: string, format: uuid, description: "The largest one, proposed to keep" }
        items:
          type: array
          items: { $ref: "#/components/schemas/DuplicateItem" }
    DuplicateItem:
      type: object
      required: [id, originalName, sizeBytes, ratio, localAt]
      properties:
        id: { type: string, format: uuid }
        originalName: { type: string }
        sizeBytes: { type: integer, format: int64 }
        width: { type: integer }
        height: { type: integer }
        ratio: { type: number, format: float }
        localAt: { type: string }
    ExternalLibrary:
      type: object
      required: [available, assets, missing, scanning]
      properties:
        available: { type: boolean, description: "A folder was given in .env and can be read" }
        ownerId: { type: string, format: uuid }
        assets: { type: integer, format: int64 }
        missing: { type: integer, format: int64, description: "Records whose file was not found. They are kept" }
        scanning: { type: boolean }
        scanFinishedAt: { type: string, format: date-time }
        scanError: { type: string }
    ExternalLibraryOwner:
      type: object
      required: [ownerId]
      properties:
