      type: object
      required: [columns, rows, count, intervalMs]
      properties:
        columns: { type: integer }
        rows: { type: integer }
        count: { type: integer }
        intervalMs: { type: integer }
    BulkRequest:
      type: object
      required: [ids, action]
      properties:
        ids:
