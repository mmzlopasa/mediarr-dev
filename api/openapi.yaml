openapi: 3.0.3
info:
  title: Mediarr API
  version: 0.3.0
paths:
  /health:
    get:
      operationId: getHealth
      summary: Report whether the server can reach its database
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Server cannot reach its database
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /api/auth/status:
    get:
      operationId: getAuthStatus
      summary: Report whether setup is needed and who is signed in
      responses:
        "200":
          description: Current status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthStatus" }
  /api/auth/setup:
    post:
      operationId: setup
      summary: Create the first administrator. Closed once any user exists.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "201":
          description: Administrator created and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/auth/login:
    post:
      operationId: login
      summary: Sign in with email, password and, when enabled, a TOTP code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          description: Wrong credentials, or a TOTP code is required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginError" }
        "429": { $ref: "#/components/responses/Error" }
  /api/auth/logout:
    post:
      operationId: logout
      summary: End the current session
      responses:
        "204": { description: Signed out }
  /api/me/password:
    post:
      operationId: changePassword
      summary: Change the current user's password and end their other sessions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: Password changed }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/me/totp/setup:
    post:
      operationId: setupTotp
      summary: Generate a TOTP secret. It takes effect only after confirmation.
      responses:
        "200":
          description: Secret to add to an authenticator app
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpSetup" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/me/totp/enable:
    post:
      operationId: enableTotp
      summary: Confirm a code and turn on TOTP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpCode" }
      responses:
        "204": { description: TOTP enabled }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/me/totp/disable:
    post:
      operationId: disableTotp
      summary: Turn off TOTP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordConfirm" }
      responses:
        "204": { description: TOTP disabled }
        "401": { $ref: "#/components/responses/Error" }
  /api/me/device-keys:
    post:
      operationId: createDeviceKey
      summary: Create a long-lived key for this device, used by background backup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDeviceKeyRequest" }
      responses:
        "201":
          description: The key. It is shown only once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceKey" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/me/device-keys/{id}:
    delete:
      operationId: revokeDeviceKey
      summary: Revoke one of the current user's device keys
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Key revoked }
        "401": { $ref: "#/components/responses/Error" }
  /api/admin/users:
    get:
      operationId: listUsers
      summary: List users
      responses:
        "200":
          description: All users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createUser
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/admin/overview:
    get:
      operationId: getAdminOverview
      summary: Live statistics of the whole server, read from the database and the library disk
      responses:
        "200":
          description: Current statistics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOverview" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/assets:
    get:
      operationId: listAssets
      summary: List the current user's most recent assets and their processing status
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: status
          in: query
          schema: { type: string, enum: [processing, ready, failed] }
      responses:
        "200":
          description: Assets, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetList" }
        "401": { $ref: "#/components/responses/Error" }
  /api/assets/bulk:
    post:
      operationId: bulkAssets
      summary: Apply an action to several of the current user's assets. Other assets are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkRequest" }
      responses:
        "200":
          description: How many assets changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/assets/download:
    get:
      operationId: downloadAssets
      summary: Download several originals as one uncompressed ZIP file
      parameters:
        - name: ids
          in: query
          required: true
          description: Comma-separated asset IDs, at most 100
          schema: { type: string }
      responses:
        "200":
          description: ZIP file
          content:
            application/zip:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/assets/{id}:
    get:
      operationId: getAsset
      summary: Read an asset's details and its neighbours on the timeline
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The asset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/assets/{id}/thumbnail:
    get:
      operationId: getAssetThumbnail
      summary: Read a WebP thumbnail
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: size, in: query, schema: { type: string, enum: [small, large, full], default: small } }
      responses:
        "200":
          description: The thumbnail
          content:
            image/webp:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/assets/{id}/original:
    get:
      operationId: getAssetOriginal
      summary: Read the unmodified original. Supports Range requests for video.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: download, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: The original file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206": { description: Part of the original file }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/assets/{id}/motion:
    get:
      operationId: getAssetMotion
      summary: Read the video embedded in an Android Motion Photo
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The video
          content:
            video/mp4:
              schema: { type: string, format: binary }
        "206": { description: Part of the video }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/assets/{id}/video/{file}:
    get:
      operationId: getAssetVideoFile
      summary: Read an HLS playlist or segment, or the scrub strip (sprite.jpg)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: file, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/timeline/buckets:
    get:
      operationId: getTimelineBuckets
      summary: List the months that have photos, newest first
      responses:
        "200":
          description: Months and how many assets each has
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimelineBuckets" }
        "401": { $ref: "#/components/responses/Error" }
  /api/timeline/buckets/{month}:
    get:
      operationId: getTimelineBucket
      summary: List one month's assets, newest first
      parameters:
        - { name: month, in: path, required: true, description: YYYY-MM, schema: { type: string } }
      responses:
        "200":
          description: The month's assets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimelineBucket" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/assets/check:
    post:
      operationId: checkAssets
      summary: Report which SHA-256 checksums the current user already has, so uploads can be skipped
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChecksumCheckRequest" }
      responses:
        "200":
          description: Checksums that already exist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChecksumCheckResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/uploads:
    post:
      operationId: createUpload
      summary: Create a resumable upload (tus 1.0). A body uploads the whole file in this request.
      responses:
        "201": { description: "Upload created; see the Location header. With a whole file in the body, also X-Asset-Id." }
        "401": { $ref: "#/components/responses/Error" }
  /api/uploads/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    head:
      operationId: getUploadOffset
      summary: Read how much of an upload has arrived (tus 1.0)
      responses:
        "200": { description: See the Upload-Offset header }
        "404": { description: No such upload }
    patch:
      operationId: appendUpload
      summary: Append data to an upload (tus 1.0). The last chunk returns X-Asset-Id.
      responses:
        "204": { description: Data stored }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: cancelUpload
      summary: Cancel an upload (tus 1.0)
      responses:
        "204": { description: Upload cancelled }
        "404": { $ref: "#/components/responses/Error" }
  /api/users/directory:
    get:
      operationId: listDirectory
      summary: The other users of this server, for choosing who to share with
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/UserRef" } }
        "401": { $ref: "#/components/responses/Error" }
  /api/albums:
    get:
      operationId: listAlbums
      summary: Albums the current user owns or that are shared with them
      parameters:
        - name: sort
          in: query
          schema: { type: string, enum: [updated, title, date], default: updated }
      responses:
        "200":
          description: Albums
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Album" } }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createAlbum
      summary: Create an album. With rules it is a smart album.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlbumCreate" }
      responses:
        "201":
          description: The album
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Album" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/albums/cameras:
    get:
      operationId: listCameras
      summary: Cameras in the current user's library, for smart album rules
      responses:
        "200":
          description: Camera names
          content:
            application/json:
              schema: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Error" }
  /api/albums/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getAlbum
      summary: Read an album and its members
      responses:
        "200":
          description: The album
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Album" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateAlbum
      summary: Change an album. Needs the editor role.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlbumUpdate" }
      responses:
        "200":
          description: The album
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Album" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAlbum
      summary: Delete an album, but not its photos. Owner only.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/albums/{id}/assets:
    post:
      operationId: addAlbumAssets
      summary: Add your own assets to an album. Needs the contributor role.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetIds" }
      responses:
        "200":
          description: How many were added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/albums/{id}/assets/remove:
    post:
      operationId: removeAlbumAssets
      summary: Remove assets from an album. A contributor can remove only what they added.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetIds" }
      responses:
        "200":
          description: How many were removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/albums/{id}/buckets:
    get:
      operationId: getAlbumBuckets
      summary: Months in an album, in the album's order
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Months
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimelineBuckets" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/albums/{id}/buckets/{month}:
    get:
      operationId: getAlbumBucket
      summary: Assets of one month in an album
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: month, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Assets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimelineBucket" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/albums/{id}/members/{userId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setAlbumMember
      summary: Share an album with a user or change their role. Owner only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberRole" }
      responses:
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeAlbumMember
      summary: End a user's access. The owner can remove anyone, and a member can leave.
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/albums/{id}/comments:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listAlbumComments
      summary: Comments on an album, or with assetId on one photo, and that photo's hearts
      parameters:
        - { name: assetId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Comments and hearts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Activity" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createAlbumComment
      summary: Comment on an album or on a photo in it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommentCreate" }
      responses:
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/albums/{id}/comments/{commentId}:
    delete:
      operationId: deleteAlbumComment
      summary: Delete a comment. The author, an editor or the owner can do this.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: commentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/albums/{id}/assets/{assetId}/heart:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setAlbumHeart
      summary: Add your heart to a photo in an album
      responses:
        "204": { description: Saved }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeAlbumHeart
      summary: Take back your heart
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/albums/{id}/links:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listAlbumLinks
      summary: Public links of an album. Owner only.
      responses:
        "200":
          description: Links
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ShareLink" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createAlbumLink
      summary: Create a public link. Its token is returned only this once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareLinkCreate" }
      responses:
        "201":
          description: The link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareLink" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/albums/{id}/links/{linkId}:
    delete:
      operationId: deleteAlbumLink
      summary: Revoke a public link. It stops working at once.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: linkId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/partners:
    get:
      operationId: listPartners
      summary: Who you share your library with, and who shares theirs with you
      responses:
        "200":
          description: Partners
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Partners" }
