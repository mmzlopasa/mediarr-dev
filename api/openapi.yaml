openapi: 3.0.3
info:
  title: Mediarr API
  version: 0.2.0
paths:
  /health:
    get:
      operationId: getHealth
      summary: Report whether the server can reach its database
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Server cannot reach its database
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /api/auth/status:
    get:
      operationId: getAuthStatus
      summary: Report whether setup is needed and who is signed in
      responses:
        "200":
          description: Current status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthStatus" }
  /api/auth/setup:
    post:
      operationId: setup
      summary: Create the first administrator. Closed once any user exists.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "201":
          description: Administrator created and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/auth/login:
    post:
      operationId: login
      summary: Sign in with email, password and, when enabled, a TOTP code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          description: Wrong credentials, or a TOTP code is required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginError" }
        "429": { $ref: "#/components/responses/Error" }
  /api/auth/logout:
    post:
      operationId: logout
      summary: End the current session
      responses:
        "204": { description: Signed out }
  /api/me/password:
    post:
      operationId: changePassword
      summary: Change the current user's password and end their other sessions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: Password changed }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/me/totp/setup:
    post:
      operationId: setupTotp
      summary: Generate a TOTP secret. It takes effect only after confirmation.
      responses:
        "200":
          description: Secret to add to an authenticator app
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpSetup" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/me/totp/enable:
    post:
      operationId: enableTotp
      summary: Confirm a code and turn on TOTP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpCode" }
      responses:
        "204": { description: TOTP enabled }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/me/totp/disable:
    post:
      operationId: disableTotp
      summary: Turn off TOTP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordConfirm" }
      responses:
        "204": { description: TOTP disabled }
        "401": { $ref: "#/components/responses/Error" }
  /api/me/device-keys:
    post:
      operationId: createDeviceKey
      summary: Create a long-lived key for this device, used by background backup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDeviceKeyRequest" }
      responses:
        "201":
          description: The key. It is shown only once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceKey" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/me/device-keys/{id}:
    delete:
      operationId: revokeDeviceKey
      summary: Revoke one of the current user's device keys
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Key revoked }
        "401": { $ref: "#/components/responses/Error" }
  /api/admin/users:
    get:
      operationId: listUsers
      summary: List users
      responses:
        "200":
          description: All users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createUser
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/admin/overview:
    get:
      operationId: getAdminOverview
      summary: Live statistics of the whole server, read from the database and the library disk
      responses:
        "200":
          description: Current statistics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOverview" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/assets:
    get:
      operationId: listAssets
      summary: List the current user's most recent assets and their processing status
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: status
          in: query
          schema: { type: string, enum: [processing, ready, failed] }
      responses:
        "200":
          description: Assets, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetList" }
        "401": { $ref: "#/components/responses/Error" }
  /api/assets/bulk:
    post:
      operationId: bulkAssets
      summary: Apply an action to several of the current user's assets. Other assets are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkRequest" }
      responses:
        "200":
          description: How many assets changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/assets/download:
    get:
      operationId: downloadAssets
      summary: Download several originals as one uncompressed ZIP file
      parameters:
        - name: ids
          in: query
          required: true
          description: Comma-separated asset IDs, at most 100
          schema: { type: string }
      responses:
        "200":
          description: ZIP file
          content:
            application/zip:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/assets/{id}:
    get:
      operationId: getAsset
      summary: Read an asset's details and its neighbours on the timeline
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The asset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/assets/{id}/thumbnail:
    get:
      operationId: getAssetThumbnail
      summary: Read a WebP thumbnail
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: size, in: query, schema: { type: string, enum: [small, large, full], default: small } }
      responses:
        "200":
          description: The thumbnail
          content:
            image/webp:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/assets/{id}/original:
    get:
      operationId: getAssetOriginal
      summary: Read the unmodified original. Supports Range requests for video.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: download, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: The original file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206": { description: Part of the original file }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/assets/{id}/motion:
    get:
      operationId: getAssetMotion
      summary: Read the video embedded in an Android Motion Photo
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The video
          content:
            video/mp4:
              schema: { type: string, format: binary }
        "206": { description: Part of the video }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/assets/{id}/video/{file}:
    get:
      operationId: getAssetVideoFile
      summary: Read an HLS playlist or segment, or the scrub strip (sprite.jpg)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: file, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/timeline/buckets:
    get:
      operationId: getTimelineBuckets
      summary: List the months that have photos, newest first
      responses:
        "200":
          description: Months and how many assets each has
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimelineBuckets" }
        "401": { $ref: "#/components/responses/Error" }
  /api/timeline/buckets/{month}:
    get:
      operationId: getTimelineBucket
      summary: List one month's assets, newest first
      parameters:
        - { name: month, in: path, required: true, description: YYYY-MM, schema: { type: string } }
      responses:
        "200":
          description: The month's assets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimelineBucket" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/assets/check:
    post:
      operationId: checkAssets
      summary: Report which SHA-256 checksums the current user already has, so uploads can be skipped
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChecksumCheckRequest" }
      responses:
        "200":
          description: Checksums that already exist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChecksumCheckResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/uploads:
    post:
      operationId: createUpload
      summary: Create a resumable upload (tus 1.0). A body uploads the whole file in this request.
      responses:
        "201": { description: "Upload created; see the Location header. With a whole file in the body, also X-Asset-Id." }
        "401": { $ref: "#/components/responses/Error" }
  /api/uploads/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    head:
      operationId: getUploadOffset
      summary: Read how much of an upload has arrived (tus 1.0)
      responses:
        "200": { description: See the Upload-Offset header }
        "404": { description: No such upload }
    patch:
      operationId: appendUpload
      summary: Append data to an upload (tus 1.0). The last chunk returns X-Asset-Id.
      responses:
        "204": { description: Data stored }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: cancelUpload
      summary: Cancel an upload (tus 1.0)
      responses:
        "204": { description: Upload cancelled }
        "404": { $ref: "#/components/responses/Error" }
components:
  responses:
    Error:
      description: The request failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, unavailable] }
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
    LoginError:
      type: object
      required: [message, totpRequired]
      properties:
        message: { type: string }
        totpRequired: { type: boolean }
    AuthStatus:
      type: object
      required: [setupRequired]
      properties:
        setupRequired: { type: boolean }
        user: { $ref: "#/components/schemas/User" }
    User:
      type: object
      required: [id, email, name, isAdmin, totpEnabled]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        isAdmin: { type: boolean }
        totpEnabled: { type: boolean }
    SetupRequest:
      type: object
      required: [email, name, password]
      properties:
        email: { type: string }
        name: { type: string }
        password: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
        totpCode: { type: string }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string }
    CreateUserRequest:
      type: object
      required: [email, name, password, isAdmin]
      properties:
        email: { type: string }
        name: { type: string }
        password: { type: string }
        isAdmin: { type: boolean }
    CreateDeviceKeyRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
    DeviceKey:
      type: object
      required: [id, key]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
    TotpSetup:
      type: object
      required: [secret, uri]
      properties:
        secret: { type: string }
        uri: { type: string }
    TotpCode:
      type: object
      required: [code]
      properties:
        code: { type: string }
    PasswordConfirm:
      type: object
      required: [password]
      properties:
        password: { type: string }
    AdminOverview:
      type: object
      required: [users, photos, videos, processing, failed, libraryBytes, diskTotalBytes, diskFreeBytes, jobs, version, databaseVersion]
      properties:
        users: { type: integer, format: int64 }
        photos: { type: integer, format: int64 }
        videos: { type: integer, format: int64 }
        processing: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
        libraryBytes: { type: integer, format: int64, description: Total size of all originals }
        diskTotalBytes: { type: integer, format: int64 }
        diskFreeBytes: { type: integer, format: int64 }
        jobs:
          type: object
          required: [queued, running, completed, failed]
          properties:
            queued: { type: integer, format: int64 }
            running: { type: integer, format: int64 }
            completed: { type: integer, format: int64 }
            failed: { type: integer, format: int64 }
        version: { type: string }
        databaseVersion: { type: string }
    Asset:
      type: object
      required: [id, originalName, kind, status, sizeBytes, checksum, createdAt]
      properties:
        id: { type: string, format: uuid }
        originalName: { type: string }
        kind: { type: string, enum: [unknown, photo, video] }
        status: { type: string, enum: [processing, ready, failed] }
        error: { type: string }
        sizeBytes: { type: integer, format: int64 }
        checksum: { type: string, description: Lowercase hex SHA-256 }
        width: { type: integer }
        height: { type: integer }
        blurhash: { type: string }
        takenAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    TimelineBuckets:
      type: object
      required: [buckets]
      properties:
        buckets:
          type: array
          items:
            type: object
            required: [month, count]
            properties:
              month: { type: string }
              count: { type: integer, format: int64 }
    TimelineItem:
      type: object
      required: [id, kind, ratio, isFavorite, localAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [unknown, photo, video] }
        ratio: { type: number, format: float, description: "Width divided by height, as displayed" }
        blurhash: { type: string }
        isFavorite: { type: boolean }
        isLive: { type: boolean }
        durationMs: { type: integer, format: int64 }
        localAt: { type: string, description: "Local capture time without a zone: 2006-01-02T15:04:05" }
    TimelineBucket:
      type: object
      required: [month, items]
      properties:
        month: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/TimelineItem" }
    AssetDetail:
      type: object
      required: [id, originalName, kind, status, sizeBytes, isFavorite, isArchived, localAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        originalName: { type: string }
        kind: { type: string, enum: [unknown, photo, video] }
        status: { type: string, enum: [processing, ready, failed] }
        mimeType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        width: { type: integer }
        height: { type: integer }
        isFavorite: { type: boolean }
        isArchived: { type: boolean }
        localAt: { type: string }
        offsetMinutes: { type: integer }
        hasCaptureTime: { type: boolean }
        createdAt: { type: string, format: date-time }
        newerId: { type: string, format: uuid }
        olderId: { type: string, format: uuid }
        durationMs: { type: integer, format: int64 }
        videoCodec: { type: string }
        hlsReady: { type: boolean, description: "The adaptive stream at video/master.m3u8 can be played" }
        liveVideoId: { type: string, format: uuid, description: The video of a Live Photo }
        hasMotion: { type: boolean, description: "An Android Motion Photo, with its video at /motion" }
        sprite: { $ref: "#/components/schemas/Sprite" }
        camera: { type: string }
        lens: { type: string }
        iso: { type: integer }
        fNumber: { type: number, format: double }
        exposureTime: { type: string }
        focalLength: { type: number, format: double }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
    Sprite:
      type: object
      required: [columns, rows, count, intervalMs]
      properties:
        columns: { type: integer }
        rows: { type: integer }
        count: { type: integer }
        intervalMs: { type: integer }
    BulkRequest:
      type: object
      required: [ids, action]
      properties:
        ids:
          type: array
          maxItems: 1000
          items: { type: string, format: uuid }
        action: { type: string, enum: [favorite, unfavorite, archive, delete] }
    BulkResponse:
      type: object
      required: [changed]
      properties:
        changed: { type: integer, format: int64 }
    AssetList:
      type: object
      required: [items, total, processing, failed]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Asset" }
        total: { type: integer, format: int64 }
        processing: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
    ChecksumCheckRequest:
      type: object
      required: [checksums]
      properties:
        checksums:
          type: array
          maxItems: 1000
          items: { type: string }
    ChecksumCheckResponse:
      type: object
      required: [existing]
      properties:
        existing:
          type: array
          items: { type: string }
