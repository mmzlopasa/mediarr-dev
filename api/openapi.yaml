    AssetList:
      type: object
      required: [items, total, processing, failed]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Asset" }
        total: { type: integer, format: int64 }
        processing: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
    ChecksumCheckRequest:
      type: object
      required: [checksums]
      properties:
        checksums:
          type: array
          maxItems: 1000
          items: { type: string }
    ChecksumCheckResponse:
      type: object
      required: [existing]
      properties:
        existing:
          type: array
          items: { type: string }
