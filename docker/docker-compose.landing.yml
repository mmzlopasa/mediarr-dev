# The public site on mediarr.app. Not part of the app that users install. Run through `make landing`.
name: mediarr-landing

services:
  landing:
    image: nginx:1.30-alpine
    ports:
      - "127.0.0.1:9851:80"
    volumes:
      - ../landing:/usr/share/nginx/html:ro
      # Outside the read-only html mount, because Docker cannot create mount points inside it.
      # The whole folder, not single files: a file mount keeps the old copy after an edit.
      - ../web/src/lib/design:/srv/design:ro
      - ../web/static:/srv/static:ro
    configs:
      - source: nginx
        target: /etc/nginx/conf.d/default.conf
    # Not read only: Docker writes the configuration above into the container when it starts.
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

configs:
  nginx:
    content: |
      # The page loads only its own files. The one inline script, in <head>, picks the motion class
      # before the first paint and is allowed by its hash: after changing it, put the new hash here
      # (the browser's console names it). JSON-LD is data, not a script, and needs nothing.
      # Styles may be inline, for the style attributes of the fan and the 404 page.
      map $$uri $$page_policy {
          default "default-src 'none'; script-src 'self' 'sha256-PFW/sMjMQWus+K6Hz8QVPxpIPDNF33iFeTVeuv//hJM='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
      }

      server {
          listen 80;
          server_name _;
          server_tokens off;
          root /usr/share/nginx/html;

          add_header Content-Security-Policy $$page_policy always;
          add_header X-Content-Type-Options nosniff always;
          add_header Referrer-Policy strict-origin-when-cross-origin always;
          add_header X-Frame-Options DENY always;
          add_header Cross-Origin-Opener-Policy same-origin always;
          add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

          gzip on;
          gzip_types text/css application/javascript image/svg+xml application/xml text/plain application/json;
          gzip_min_length 512;
          error_page 404 /404.html;

          location = /health {
              access_log off;
              default_type application/json;
              return 200 '{"status":"ok"}';
          }

          # ^~ keeps the rule for pictures below from taking the design's fonts and icons.
          location ^~ /design/ {
              alias /srv/design/;
          }

          # The same icons as the app: the fan, as SVG and as .ico for browsers that ask for it.
          location ~ ^/(favicon\.svg|favicon\.ico)$$ {
              alias /srv/static/$$1;
          }

          # Pictures change rarely; the page itself is always asked for again.
          location ~* \.(jpg|png|webp|svg|woff2|ico)$$ {
              # A location with headers of its own does not inherit the server's, so they are repeated.
              add_header Content-Security-Policy $$page_policy always;
              add_header X-Content-Type-Options nosniff always;
              add_header Referrer-Policy strict-origin-when-cross-origin always;
              add_header X-Frame-Options DENY always;
              add_header Cache-Control "public, max-age=604800";
              try_files $$uri =404;
          }

          # Any other address is not found, so search engines do not see the page under many names.
          location / {
              try_files $$uri $$uri/ =404;
          }
      }
