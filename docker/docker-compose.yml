name: mediarr

# Each container keeps at most 50 MB of logs, instead of filling the disk over the months.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

x-server: &server
  image: ghcr.io/mediarr-app/mediarr-server:${MEDIARR_VERSION:-latest}
  env_file: .env
  environment:
    DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/mediarr
  user: ${PUID:-10001}:${PGID:-10001}
  volumes:
    - ${UPLOAD_LOCATION}:/data/library
    - ${CACHE_LOCATION}:/data/cache
    - ${EXTERNAL_LIBRARY_PATH:-/dev/null}:/external:ro
    - ${BACKUP_PATH:-/dev/null}:/backup
  networks: [default, database]
  # A program started inside cannot gain privileges through setuid files. The server runs as a
  # normal user and has no capabilities to drop. It is not given a read-only system: video, backups
  # and metadata tools write temporary files in places that differ between versions.
  security_opt: ["no-new-privileges:true"]
  # Far above what the server and its tools use, low enough to stop a runaway process.
  pids_limit: 4096
  # Unlimited unless set in .env (SERVER_MEM_LIMIT, WORKER_MEM_LIMIT, e.g. 4g): libraries differ.
  mem_limit: ${SERVER_MEM_LIMIT:-0}
  depends_on:
    db:
      condition: service_healthy
  logging: *logging
  restart: unless-stopped

services:
  server:
    <<: *server
    command: ["serve"]
    healthcheck:
      test: ["CMD", "/mediarr", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    <<: *server
    command: ["worker"]
    mem_limit: ${WORKER_MEM_LIMIT:-0}
    depends_on:
      server:
        condition: service_healthy

  # Lets TVs on the home network find Mediarr and browse albums (DLNA). Off unless COMPOSE_PROFILES
  # in .env has dlna, and the administrator turns on the DLNA server in the settings. It needs the
  # host's network to be seen by TVs, and passes only /dlna/ on to Mediarr.
  dlna:
    image: ghcr.io/mediarr-app/mediarr-server:${MEDIARR_VERSION:-latest}
    profiles: ["dlna"]
    command: ["dlna"]
    network_mode: host
    user: ${PUID:-10001}:${PGID:-10001}
    environment:
      MEDIARR_URL: ${DLNA_MEDIARR_URL:-http://127.0.0.1:${HTTP_PORT:-9851}}
      DLNA_PORT: ${DLNA_PORT:-8200}
    security_opt: ["no-new-privileges:true"]
    pids_limit: 1024
    depends_on:
      nginx:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped

  ml:
    image: ghcr.io/mediarr-app/mediarr-ml:${MEDIARR_VERSION:-latest}
    profiles: ["ml"]
    # Only what the service reads: it has no use for the database password or other secrets.
    environment:
      ML_TOKEN: ${ML_TOKEN:-}
      ML_IDLE_MINUTES: ${ML_IDLE_MINUTES:-}
      ML_FACE_MODEL: ${ML_FACE_MODEL:-}
      ML_THREADS: ${ML_THREADS:-}
      ML_ACCEL: ${ML_ACCEL:-}
      ML_MAX_BODY_MB: ${ML_MAX_BODY_MB:-}
    volumes:
      - model-cache:/models
    # The service writes only its models, in the volume, and temporary files, in /tmp. It runs as a
    # normal user with no capabilities, on a system it cannot change.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 1024
    # Unlimited unless set in .env. While it works the service needs about 2 GB.
    mem_limit: ${ML_MEM_LIMIT:-0}
    logging: *logging
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.40.16
    profiles: ["descriptions"]
    volumes:
      - ollama-models:/root/.ollama
    # Root in the image, but only over its own volume, so it needs no capabilities.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 2048
    # Unlimited unless set in .env: a model's size decides what it needs.
    mem_limit: ${OLLAMA_MEM_LIMIT:-0}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *logging
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: mediarr
      # Checksums find a page the disk has damaged. Read only when the database is first created,
      # so an existing database is left as it is.
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - ${DB_LOCATION}:/var/lib/postgresql/data
    # Only on a network without a way out: nothing but the server and the worker can reach it.
    networks: [database]
    # The image starts as root to set the owner of the data folder, then becomes postgres. Its
    # capabilities are left as they are, because folders on a NAS or a network share need them.
    security_opt: ["no-new-privileges:true"]
    pids_limit: 1024
    # Time to finish writing and shut down cleanly, instead of recovering at the next start.
    stop_grace_period: 1m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d mediarr"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 256mb
    logging: *logging
    restart: unless-stopped

  nginx:
    image: nginx:1.30-alpine
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-9851}:80"
    configs:
      - source: nginx
        target: /etc/nginx/conf.d/default.conf
    # Not read only: Docker writes the configuration above into the container when it starts.
    security_opt: ["no-new-privileges:true"]
    pids_limit: 1024
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging: *logging
    restart: unless-stopped

configs:
  nginx:
    content: |
      map $$http_upgrade $$connection_upgrade {
          default upgrade;
          ''      '';
      }

      map $$http_x_forwarded_proto $$forwarded_proto {
          default $$http_x_forwarded_proto;
          ''      $$scheme;
      }

      server {
          listen 80;
          server_name _;
          server_tokens off;

          # The server sets its own limit (MAX_UPLOAD_MB) and checks the free disk space. Uploads go
          # straight through instead of waiting in a temporary file.
          client_max_body_size 0;
          proxy_request_buffering off;
          # A slow phone on a weak connection may pause between parts of an upload.
          client_body_timeout 5m;
          # Downloads are passed on as they arrive, without a copy of a video in nginx's memory.
          proxy_max_temp_file_size 0;

          # Text is sent compressed: the timeline's JSON shrinks several times. An answer the server
          # has already compressed, such as the app's scripts, is passed on as it is.
          gzip on;
          gzip_proxied any;
          gzip_vary on;
          gzip_comp_level 5;
          gzip_min_length 1024;
          gzip_types text/css text/plain text/xml application/javascript application/json
                     application/xml application/manifest+json image/svg+xml;

          resolver 127.0.0.11 valid=5s;

          location = /nginx-health {
              access_log off;
              default_type text/plain;
              return 200 "ok\n";
          }

          # The server's own answers, with its security headers and cache rules, pass unchanged:
          # nothing here adds a header to them or keeps a copy.
          location / {
              set $$upstream http://server:8080;
              proxy_pass $$upstream;
              proxy_http_version 1.1;
              proxy_read_timeout 1h;
              proxy_send_timeout 1h;

              proxy_set_header Host $$http_host;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection $$connection_upgrade;
              # Replaced, never passed on, so a visitor cannot choose the address the server sees.
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$forwarded_proto;
          }
      }

networks:
  default:
  # The database's own network has no route out of the host and no published port.
  database:
    internal: true

volumes:
  ollama-models:
  model-cache:
