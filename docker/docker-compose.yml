name: mediarr

x-server: &server
  image: ghcr.io/mmzlopasa/mediarr-server:${MEDIARR_VERSION:-latest}
  env_file: .env
  environment:
    DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/mediarr
  user: ${PUID:-10001}:${PGID:-10001}
  volumes:
    - ${UPLOAD_LOCATION}:/data/library
    - ${CACHE_LOCATION}:/data/cache
    - ${EXTERNAL_LIBRARY_PATH:-/dev/null}:/external:ro
    - ${BACKUP_PATH:-/dev/null}:/backup
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  server:
    <<: *server
    command: ["serve"]
    healthcheck:
      test: ["CMD", "/mediarr", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    <<: *server
    command: ["worker"]
    depends_on:
      server:
        condition: service_healthy

  ml:
    image: ghcr.io/mmzlopasa/mediarr-ml:${MEDIARR_VERSION:-latest}
    profiles: ["ml"]
    env_file: .env
    volumes:
      - model-cache:/models
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: mediarr
    volumes:
      - ${DB_LOCATION}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d mediarr"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 256mb
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-9851}:80"
    configs:
      - source: nginx
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

configs:
  nginx:
    content: |
      map $$http_upgrade $$connection_upgrade {
          default upgrade;
          ''      '';
      }

      map $$http_x_forwarded_proto $$forwarded_proto {
          default $$http_x_forwarded_proto;
          ''      $$scheme;
      }

      server {
          listen 80;
          server_name _;
          server_tokens off;

          client_max_body_size 0;
          proxy_request_buffering off;

          resolver 127.0.0.11 valid=5s;

          location = /nginx-health {
              access_log off;
              default_type text/plain;
              return 200 "ok\n";
          }

          location / {
              set $$upstream http://server:8080;
              proxy_pass $$upstream;
              proxy_http_version 1.1;
              proxy_read_timeout 1h;

              proxy_set_header Host $$http_host;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection $$connection_upgrade;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$forwarded_proto;
          }
      }

volumes:
  ollama-models:
  model-cache:
