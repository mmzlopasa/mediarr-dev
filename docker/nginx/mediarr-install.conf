location = /install/docker-compose.yml {
    alias /home/scyde/mediarr-apps/install/docker-compose.yml;
    default_type text/yaml;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
}

location = /install/example.env {
    alias /home/scyde/mediarr-apps/install/example.env;
    default_type text/plain;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
}

location = /apps/mediarr-dev.ipa {
    alias /home/scyde/mediarr-apps/mediarr-dev.ipa;
    default_type application/octet-stream;
    add_header Content-Disposition 'attachment; filename="MediarrDev.ipa"' always;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
}

location = /apps/mediarr-dev.apk {
    alias /home/scyde/mediarr-apps/mediarr-dev.apk;
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename="MediarrDev.apk"' always;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
}
