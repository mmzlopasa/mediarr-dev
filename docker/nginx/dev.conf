# Development entry point: API goes to the Go server, everything else to Vite.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# The development stack is for this machine only. Whatever a proxy in front sends under a public
# name is refused, so the development server can never be reached from the internet again.
server {
    listen 80 default_server;
    server_name _;
    default_type text/plain;
    return 503 "Not available.\n";
}

server {
    listen 80;
    server_name 127.0.0.1 localhost;
    client_max_body_size 0;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Resolve at request time, so nginx survives restarts of the dev containers.
    resolver 127.0.0.11 valid=5s;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /health {
        set $server_upstream http://server:8080;
        proxy_pass $server_upstream;
    }

    location /api/ {
        set $server_upstream http://server:8080;
        proxy_pass $server_upstream;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        # Setting a header here drops the inherited ones, so all of them are repeated.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # The dev server is reachable from the internet through the demo, and on 2026-11-16 a botnet ran
    # code in it by writing JavaScript into the name of a virtual module. Only plain module names may
    # reach these modules, and files outside the app are never served.
    location ~ ^/@id/__vite-(browser-external|optional-peer-dep) {
        if ($uri !~ "^/@id/__vite-(browser-external|optional-peer-dep):[A-Za-z0-9@/._:+-]*$") {
            return 404;
        }
        if ($args ~ "[`(){};'\"\\]|%60|%28|%29|%7[BbDd]|%3[Bb]|%22|%27|%5[Cc]") {
            return 404;
        }
        set $web_upstream http://web:5173;
        proxy_pass $web_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Amzn-Trace-Context "";
    }

    location ~ ^/@fs/(?!src/web/) {
        return 404;
    }

    location / {
        set $web_upstream http://web:5173;
        proxy_pass $web_upstream;
        # The header that the 2026-11-16 implant took its commands from never reaches the dev server.
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Amzn-Trace-Context "";
    }
}
