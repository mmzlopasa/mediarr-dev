# App downloads for mediarr.app. Install to /etc/nginx/sites-available/cdn.mediarr.app (see README).
# Starts as HTTP only; certbot --nginx adds the 443 block and the redirect.
server {
    listen 80;
    listen [::]:80;
    server_name cdn.mediarr.app;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Only these files exist here. No directory listing, and nothing else in the folder is served.
    location = /apps/mediarr.ipa {
        alias /home/scyde/mediarr-apps/mediarr.ipa;
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment; filename="Mediarr.ipa"' always;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /apps/mediarr.apk {
        alias /home/scyde/mediarr-apps/mediarr.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="Mediarr.apk"' always;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /install/docker-compose.yml {
        alias /home/scyde/mediarr-apps/install/docker-compose.yml;
        default_type text/yaml;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /install/example.env {
        alias /home/scyde/mediarr-apps/install/example.env;
        default_type text/plain;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    include snippets/mediarr-maps.conf;

    location / {
        return 404;
    }
}
