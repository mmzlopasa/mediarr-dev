[project]
name = "mediarr-ml"
version = "0.1.0"
description = "Mediarr machine learning service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "python-multipart>=0.0.33",
    "rapidocr>=3.10.0",
    "tokenizers>=0.23.3",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
