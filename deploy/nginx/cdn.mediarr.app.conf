# App downloads for mediarr.app. Install to /etc/nginx/sites-available/cdn.mediarr.app (see README).
# Starts as HTTP only; certbot --nginx adds the 443 block and the redirect.
server {
    listen 80;
    listen [::]:80;
    server_name cdn.mediarr.app;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Only these two files exist here. No directory listing, and nothing else in the folder is served.
    location = /apps/mediarr.ipa {
        alias /home/scyde/mediarr-apps/mediarr.ipa;
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment; filename="Mediarr.ipa"' always;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /apps/mediarr.apk {
        alias /home/scyde/mediarr-apps/mediarr.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="Mediarr.apk"' always;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # The map's background, for every installation that keeps the default style. Files are read in
    # parts from other addresses, so range requests and CORS are required.
    location /maps/ {
        alias /mnt/mediarr/tiles/;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Headers "Range" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag" always;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location / {
        return 404;
    }
}
