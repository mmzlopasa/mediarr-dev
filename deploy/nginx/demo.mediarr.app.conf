# Install to /etc/nginx/sites-available/demo.mediarr.app (see README).
# Starts as HTTP only; certbot --nginx adds the 443 block and the redirect.
# Serves the hot-reload development stack, so changes appear immediately.
map $http_upgrade $demo_connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name demo.mediarr.app;

    client_max_body_size 0;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:9852;
        proxy_http_version 1.1;
        proxy_read_timeout 1h;

        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $demo_connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
