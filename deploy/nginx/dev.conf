# Development entry point: API goes to the Go server, everything else to Vite.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 0;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Resolve at request time, so nginx survives restarts of the dev containers.
    resolver 127.0.0.11 valid=5s;

    # Temporary: browser traces show up in this access log. Only the dev stack has this.
    location = /__diag {
        return 204;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /health {
        set $server_upstream http://server:8080;
        proxy_pass $server_upstream;
    }

    location /api/ {
        set $server_upstream http://server:8080;
        proxy_pass $server_upstream;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        # Setting a header here drops the inherited ones, so all of them are repeated.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location / {
        set $web_upstream http://web:5173;
        proxy_pass $web_upstream;
    }
}
