# Development entry point: API goes to the Go server, everything else to Vite.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;
    client_max_body_size 0;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Resolve at request time, so nginx survives restarts of the dev containers.
    resolver 127.0.0.11 valid=5s;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /health {
        set $server_upstream http://server:8080;
        proxy_pass $server_upstream;
    }

    location / {
        set $web_upstream http://web:5173;
        proxy_pass $web_upstream;
    }
}
