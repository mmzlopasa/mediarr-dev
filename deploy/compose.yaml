# Mediarr install file. This file and .env are all a user needs:
#   curl -O <release>/compose.yaml && curl -o .env <release>/.env.example
#   edit .env, then: docker compose up -d
#   open http://<server-ip>:9851
# Building from source instead: see compose.build.yaml.
name: mediarr

x-server: &server
  image: ghcr.io/mmzlopasa/mediarr-server:${MEDIARR_VERSION:-latest}
  env_file: .env
  environment:
    DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/mediarr
  user: ${PUID:-10001}:${PGID:-10001}
  volumes:
    - ${UPLOAD_LOCATION}:/data/library
    - ${CACHE_LOCATION}:/data/cache
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  server:
    <<: *server
    command: ["serve"]
    healthcheck:
      test: ["CMD", "/mediarr", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Starts after the server, which applies migrations and prepares storage.
  worker:
    <<: *server
    command: ["worker"]
    depends_on:
      server:
        condition: service_healthy

  ml:
    image: ghcr.io/mmzlopasa/mediarr-ml:${MEDIARR_VERSION:-latest}
    profiles: ["ml"]
    env_file: .env
    volumes:
      - model-cache:/models
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: mediarr
    volumes:
      - ${DB_LOCATION}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d mediarr"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 256mb
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      # Open at http://<server-ip>:9851. No domain or TLS is needed on a local network.
      # Docker-published ports bypass ufw, so do not expose this port directly to the internet.
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-9851}:80"
    configs:
      - source: nginx
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

# Inline, so that installing needs no other files. `$$` is a literal `$` for nginx.
configs:
  nginx:
    content: |
      map $$http_upgrade $$connection_upgrade {
          default upgrade;
          ''      '';
      }

      map $$http_x_forwarded_proto $$forwarded_proto {
          default $$http_x_forwarded_proto;
          ''      $$scheme;
      }

      server {
          listen 80;
          server_name _;
          server_tokens off;

          # Uploads are streamed to the server, which enforces its own limits.
          client_max_body_size 0;
          proxy_request_buffering off;

          # Resolve at request time, because the server's IP changes when it is recreated.
          resolver 127.0.0.11 valid=5s;

          # Liveness of nginx itself, so an API outage does not restart the proxy.
          location = /nginx-health {
              access_log off;
              default_type text/plain;
              return 200 "ok\n";
          }

          location / {
              set $$upstream http://server:8080;
              proxy_pass $$upstream;
              proxy_http_version 1.1;
              proxy_read_timeout 1h;

              # $$http_host keeps the port, which resumable upload URLs need when opened by IP.
              proxy_set_header Host $$http_host;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection $$connection_upgrade;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$forwarded_proto;
          }
      }

volumes:
  model-cache:
