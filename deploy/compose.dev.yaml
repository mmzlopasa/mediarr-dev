# Hot-reload development stack. Run through `make dev`.
# All ports stay on localhost and memory is capped, because this may run next to production apps.
name: mediarr-dev

x-go: &go
  image: mediarr-dev-go
  build:
    context: .
    dockerfile: dev.Dockerfile
  working_dir: /src/server
  user: ${DEV_UID:-1000}:${DEV_GID:-1000}
  environment:
    HOME: /tmp
    CGO_ENABLED: "0"
    GOCACHE: /cache/go-build
    GOMODCACHE: /cache/go-mod
    DATABASE_URL: postgres://mediarr:mediarr@db:5432/mediarr
    TEST_DATABASE_URL: postgres://mediarr:mediarr@db:5432/postgres
    LIBRARY_PATH: /data/library
    CACHE_PATH: /data/cache
    WORKER_CONCURRENCY: "2"
    ML_URL: http://ml:8000
    # The demo stands behind the host nginx.
    TRUSTED_PROXY_HOPS: "1"
  volumes:
    - ../server:/src/server
    - ../.dev/cache:/cache
    - ${DEV_LIBRARY:-../.dev/library}:/data/library
    - ${DEV_MEDIA_CACHE:-../.dev/media-cache}:/data/cache
    - ${DEV_EXTERNAL:-../.dev/external}:/external:ro
    - ${DEV_BACKUP:-../.dev/backup}:/backup
  mem_limit: 2g
  restart: unless-stopped

services:
  server:
    <<: *go
    command: ["go", "tool", "-modfile=tools.mod", "air", "-c", ".air.toml", "--", "serve"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 120s

  # Started after the server, which applies migrations.
  worker:
    <<: *go
    command: ["go", "tool", "-modfile=tools.mod", "air", "-c", ".air.toml", "--", "worker"]
    depends_on:
      server:
        condition: service_healthy

  # The demo's AI descriptions. No limits, by the owner's decision.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ${DEV_OLLAMA:-../.dev/ollama}:/root/.ollama
    restart: unless-stopped

  ml:
    build:
      context: ../ml
    user: ${DEV_UID:-1000}:${DEV_GID:-1000}
    environment:
      HOME: /tmp
      MODEL_DIR: /models
      ML_THREADS: "4"
    volumes:
      - ${DEV_MODELS:-../.dev/models}:/models
      - ../ml/app:/app/app:ro
    mem_limit: 4g
    restart: unless-stopped

  web:
    image: node:22-slim
    working_dir: /src/web
    user: ${DEV_UID:-1000}:${DEV_GID:-1000}
    command:
      - sh
      - -c
      - npx -y pnpm@12.16.1 install --frozen-lockfile --store-dir /cache/pnpm && npx -y pnpm@12.16.1 dev --host 0.0.0.0 --port 5173
    environment:
      HOME: /tmp
      CI: "true"
      npm_config_cache: /cache/npm
    ports:
      - "127.0.0.1:9853:5173"
    volumes:
      - ../web:/src/web
      # Kept apart from the host's node_modules, so each side has its own store.
      - ../.dev/web-node_modules:/src/web/node_modules
      - ../.dev/cache:/cache
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 120s
    mem_limit: 2g
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: mediarr
      POSTGRES_PASSWORD: mediarr
      POSTGRES_DB: mediarr
    ports:
      - "127.0.0.1:9854:5432"
    volumes:
      - dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediarr -d mediarr"]
      interval: 5s
      timeout: 5s
      retries: 10
    shm_size: 256mb
    mem_limit: 1g
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:9852:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      server:
        condition: service_healthy
      web:
        condition: service_healthy
    mem_limit: 128m
    restart: unless-stopped

volumes:
  dev-db:
