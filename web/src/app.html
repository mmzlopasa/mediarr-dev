<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
		<meta name="theme-color" content="#0D0F14" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#EEF0F3" media="(prefers-color-scheme: light)" />
		<meta name="color-scheme" content="dark light" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/icon-180.png" />
		<script>
			(function (d) {
				try {
					var t = localStorage.getItem('mediarr_theme');
					if (t !== 'light' && t !== 'dark')
						t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
					d.dataset.theme = t;
				} catch {
					d.dataset.theme = 'dark';
				}
			})(document.documentElement);
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="boot" aria-hidden="true"><span></span></div>
		<style>
			#boot {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: grid;
				place-items: center;
				background: light-dark(#eef0f3, #0d0f14);
				transition: opacity 0.2s;
			}
			#boot span {
				width: 34px;
				height: 34px;
				border: 3px solid #8b7cff55;
				border-top-color: #ffd76a;
				border-radius: 50%;
				animation: boot 0.8s linear infinite;
			}
			@keyframes boot {
				to {
					rotate: 360deg;
				}
			}
		</style>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
