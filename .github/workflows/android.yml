name: Android app

# Builds an unsigned APK, which scripts/pull-apk.sh signs on the server. Never a GitHub release.
# A push to main is Mediarr Dev (cdn.mediarr.app/apps/mediarr-dev.apk). A tag app-v* is the stable app.
# Also runs the app and its native backup on an emulator.
on:
  workflow_dispatch:
  push:
    tags: ["app-v*"]
    branches: [main]
    paths:
      - mobile/**
      - .github/workflows/android.yml

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: Make it Mediarr Dev
        if: github.ref_type != 'tag'
        run: dev-channel/apply.sh
      - run: flutter pub get
      - name: Accept the Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - name: Collect the APK
        run: |
          mkdir -p build/out
          find build/app/outputs -name '*-release*.apk' | head -5
          cp "$(find build/app/outputs -name '*-release*.apk' | head -1)" build/out/mediarr-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_type == 'tag' && 'Mediarr-apk' || 'Mediarr-apk-dev' }}
          path: mobile/build/out/mediarr-unsigned.apk
          retention-days: 30
          if-no-files-found: error

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Allow the emulator to use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: mobile
          script: bash ../scripts/android-integration.sh
