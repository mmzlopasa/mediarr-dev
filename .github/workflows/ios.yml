name: iOS app

# Builds an unsigned .ipa for sideloading through Feather, which signs it on install. Never a GitHub release.
# A push to main is Mediarr Dev (cdn.mediarr.app/apps/mediarr-dev.ipa). A tag app-v* is the stable app.
on:
  workflow_dispatch:
  push:
    tags: ["app-v*"]
    branches: [main]
    paths:
      - mobile/**
      - .github/workflows/ios.yml

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      # Swift packages such as MapLibre come from GitHub releases, which sometimes answer 504 for
      # a while. Kept between runs, a build does not need them each time.
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: swiftpm-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: swiftpm-
      - name: Make it Mediarr Dev
        if: github.ref_type != 'tag'
        run: dev-channel/apply.sh
      - run: flutter pub get
      - run: flutter test
      - name: Test the native backup code
        run: |
          flutter build ios --config-only --no-codesign
          DEVICE=$(xcrun simctl list devices available | grep -m1 -E 'iPhone' | grep -oE '[0-9A-F-]{36}')
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            -only-testing:RunnerTests CODE_SIGNING_ALLOWED=NO | tail -40
          test "${PIPESTATUS[0]}" -eq 0
        shell: bash
      - run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
      - name: The widget is in the app, with the app's version
        run: |
          app=build/ios/iphoneos/Runner.app
          widget=$app/PlugIns/MediarrWidget.appex
          test -x "$widget/MediarrWidget"
          for key in CFBundleShortVersionString CFBundleVersion; do
            mine=$(/usr/libexec/PlistBuddy -c "Print :$key" "$app/Info.plist")
            its=$(/usr/libexec/PlistBuddy -c "Print :$key" "$widget/Info.plist")
            echo "$key: app $mine, widget $its"
            test "$mine" = "$its"
          done
      - name: Package the .ipa
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          zip -qry Mediarr.ipa Payload
          ls -la Mediarr.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_type == 'tag' && 'Mediarr-ipa' || 'Mediarr-ipa-dev' }}
          path: mobile/build/ipa/Mediarr.ipa
          retention-days: 30
          if-no-files-found: error
