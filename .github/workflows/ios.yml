name: iOS app

# Builds an unsigned .ipa for sideloading through Feather, which signs it on install.
# Published on https://cdn.mediarr.app/apps/mediarr.ipa, never as a GitHub release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - mobile/**
      - .github/workflows/ios.yml

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: Test the native backup code
        run: |
          flutter build ios --config-only --no-codesign
          DEVICE=$(xcrun simctl list devices available | grep -m1 -E 'iPhone' | grep -oE '[0-9A-F-]{36}')
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            -only-testing:RunnerTests CODE_SIGNING_ALLOWED=NO | tail -40
          test "${PIPESTATUS[0]}" -eq 0
        shell: bash
      - run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
      - name: Package the .ipa
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          zip -qry Mediarr.ipa Payload
          ls -la Mediarr.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Mediarr-ipa
          path: mobile/build/ipa/Mediarr.ipa
          retention-days: 30
          if-no-files-found: error
