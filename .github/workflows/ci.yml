name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.sum
            server/tools.sum
      - run: go tool -modfile=tools.mod golangci-lint run ./...
      - name: Start the dev database and tools
        working-directory: .
        run: |
          mkdir -p .dev/cache .dev/library .dev/media-cache
          docker compose -f docker/docker-compose.dev.yml build server
          docker compose -f docker/docker-compose.dev.yml up -d --wait db
          docker compose -f docker/docker-compose.dev.yml run --rm --no-deps --user "$(id -u):$(id -g)" server go test ./...

  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: machine-learning
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.13.6
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          mkdir -p docs/static/install
          cp docker/docker-compose.yml docker/example.env docs/monitoring/grafana-dashboard.json docs/static/install/
      - run: pnpm install --frozen-lockfile
        working-directory: docs
      - run: pnpm build
        working-directory: docs
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp docker/example.env docker/.env
      - run: docker compose -f docker/docker-compose.yml config --quiet
      - run: docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml config --quiet
      - run: docker compose -f docker/docker-compose.dev.yml config --quiet
      - run: docker compose -f docker/docker-compose.landing.yml config --quiet

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: docker build -t mediarr-dev-go -f docker/dev.Dockerfile docker
      # Search is measured with the real model, which is too large to fetch on every run.
      - uses: actions/cache@v4
        with:
          path: .models
          key: search-model-siglip2-fp16-v1
      # Frame rates on shared runners are too noisy to fail a build; load times are checked.
      - run: make bench BENCH_SKIP_FPS=1
        env:
          DEV_MODELS: ${{ github.workspace }}/.models
