name: iOS integration tests

# Runs the app and its native backup on a simulator. Separate from the build, so that the .ipa is
# still published if the simulator has a bad day; the result of this run is what counts for the gate.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - mobile/**
      - .github/workflows/ios-integration.yml

permissions:
  contents: read

jobs:
  integration:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Start a simulator, with access to photos
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -E 'iPhone' | grep -oE '[0-9A-F-]{36}')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE"
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
      - name: Install the app once, and allow it to read photos
        run: |
          # Changing this for a running app makes iOS stop it, and without it a dialog waits forever.
          # The test's own build, because iOS ties the access to this very binary.
          flutter build ios --simulator --debug --target=integration_test/app_test.dart
          xcrun simctl install "$DEVICE" build/ios/iphonesimulator/Runner.app
          xcrun simctl privacy "$DEVICE" grant photos app.mediarr.mediarr
          # In this Xcode the command alone leaves the app without access, so it also goes in directly.
          TCC="$HOME/Library/Developer/CoreSimulator/Devices/$DEVICE/data/Library/TCC/TCC.db"
          echo "after the command:"; sqlite3 "$TCC" "SELECT service, client, auth_value FROM access WHERE client='app.mediarr.mediarr'"
          xcrun simctl shutdown "$DEVICE"
          sqlite3 "$TCC" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, flags, last_modified) VALUES ('kTCCServicePhotos', 'app.mediarr.mediarr', 0, 2, 3, 1, 0, strftime('%s','now'))"
          echo "after the insert:"; sqlite3 "$TCC" "SELECT service, client, auth_value FROM access WHERE client='app.mediarr.mediarr'"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" > /dev/null
      - name: Run the tests, keeping what the app logs
        timeout-minutes: 20
        run: |
          xcrun simctl spawn "$DEVICE" log stream --level debug --predicate 'process == "Runner"' > "$RUNNER_TEMP/app.log" &
          # Runs the binary installed above: a new build would lose the access.
          flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_test.dart --use-application-binary=build/ios/iphonesimulator/Runner.app --device-id "$DEVICE" --suppress-analytics
      - name: Keep the app's log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-log
          path: ${{ runner.temp }}/app.log
          retention-days: 7
          if-no-files-found: ignore
