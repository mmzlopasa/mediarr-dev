name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vet and test, with the same media tools as the image
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo/server golang:1.27-alpine sh -c \
            "apk add --no-cache vips-tools vips-heif exiftool ffmpeg libheif-tools libraw-tools curl font-dejavu restic postgresql17-client && go vet ./... && go test ./..."

  machine-learning:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: machine-learning
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.13.6
      - run: uv run ruff check .
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp docker/example.env docker/.env
      - run: docker compose -f docker/docker-compose.yml config --quiet
      - run: docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml config --quiet
