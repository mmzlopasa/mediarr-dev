name: Release images

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  images:
    runs-on: ubuntu-latest
    # Only this job may push, and only images.
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: mediarr-server
            context: .
            dockerfile: server/Dockerfile
          - image: mediarr-ml
            context: machine-learning
            dockerfile: machine-learning/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Only a plain release (vX.Y.Z) moves latest; a tag such as v1.3.0-rc1 does not.
      - id: release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Anything else would build images with no tag at all.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a version such as v1.2.3"
            exit 1
          fi
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.release.outputs.stable }}
            type=raw,value=latest,enable=${{ steps.release.outputs.stable }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: MEDIARR_VERSION=${{ github.ref_name }}
          # How each image was built, and what is in it, go with it to the registry.
          provenance: mode=max
          sbom: true
