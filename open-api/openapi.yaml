        "201":
          description: Created
          content:
            application/json:
              schema: { type: object, additionalProperties: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/family/rules/{id}:
    delete:
