openapi: 3.0.3
info:
  title: Mediarr API
  version: 0.3.0
paths:
  /health:
    get:
      operationId: getHealth
      summary: Report whether the server can reach its database
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Server cannot reach its database
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /api/auth/status:
    get:
      operationId: getAuthStatus
      summary: Report whether setup is needed and who is signed in
      responses:
        "200":
          description: Current status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthStatus" }
  /api/auth/setup:
    post:
      operationId: setup
      summary: Create the first administrator. Closed once any user exists.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "201":
          description: Administrator created and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/auth/login:
    post:
      operationId: login
      summary: Sign in with email, password and, when enabled, a TOTP code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          description: Wrong credentials, or a TOTP code is required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginError" }
        "429": { $ref: "#/components/responses/Error" }
  /api/auth/logout:
    post:
      operationId: logout
      summary: End the current session
      responses:
        "204": { description: Signed out }
  /api/me:
    patch:
      operationId: updateProfile
      summary: Change one's own name, or email address with the current password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpdate" }
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/me/avatar:
    put:
      operationId: setAvatar
      summary: A picture of oneself, from a JPEG, PNG, WebP or HEIC image of up to 20 MB. It is cut to a square
      requestBody:
        required: true
        content:
          image/*:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeAvatar
      summary: Remove one's picture
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
  /api/users/{id}/avatar:
    get:
      operationId: getAvatar
      summary: The picture of a person with an account here, for anyone signed in
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The picture
          content:
            image/webp:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/me/password:
    post:
      operationId: changePassword
      summary: Change the current user's password and end their other sessions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: Password changed }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/me/totp/setup:
    post:
      operationId: setupTotp
      summary: Generate a TOTP secret. It takes effect only after confirmation.
      responses:
        "200":
          description: Secret to add to an authenticator app
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpSetup" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/me/totp/enable:
    post:
      operationId: enableTotp
      summary: Confirm a code and turn on TOTP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpCode" }
      responses:
        "204": { description: TOTP enabled }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/me/totp/disable:
    post:
      operationId: disableTotp
      summary: Turn off TOTP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordConfirm" }
      responses:
        "204": { description: TOTP disabled }
        "401": { $ref: "#/components/responses/Error" }
  /api/me/sessions:
    get:
      operationId: listMySessions
      summary: Where this account is signed in
      responses:
        "200":
          description: The sessions
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/UserSession" } }
        "401": { $ref: "#/components/responses/Error" }
    delete:
      operationId: endOtherSessions
      summary: Sign out everywhere except here
      responses:
        "204": { description: Signed out }
        "401": { $ref: "#/components/responses/Error" }
  /api/me/sessions/{id}:
    delete:
      operationId: endSession
      summary: Sign out one device
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Signed out }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/me/stats:
    get:
      operationId: getMyStats
      summary: How much this account holds
      responses:
        "200":
          description: The counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountStats" }
        "401": { $ref: "#/components/responses/Error" }
  /api/me/preferences:
    get:
      operationId: getMyPreferences
      summary: What this person chose
      responses:
        "200":
          description: The preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPreferences" }
        "401": { $ref: "#/components/responses/Error" }
    put:
      operationId: setMyPreferences
      summary: Change what this person chose
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserPreferences" }
      responses:
        "200":
          description: The preferences now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPreferences" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/me/api-keys:
    get:
      operationId: listAPIKeys
      summary: The current user's keys, without the keys themselves
      responses:
        "200":
          description: The keys
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ApiKey" } }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createAPIKey
      summary: Create a key with chosen rights. It is shown only once
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiKeyCreate" }
      responses:
        "201":
          description: The key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceKey" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/me/device-keys:
    post:
      operationId: createDeviceKey
      summary: Create a long-lived key for this device, used by background backup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDeviceKeyRequest" }
      responses:
        "201":
          description: The key. It is shown only once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceKey" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/me/device-keys/{id}:
    delete:
      operationId: revokeDeviceKey
      summary: Revoke one of the current user's device keys
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Key revoked }
        "401": { $ref: "#/components/responses/Error" }
  /api/me/backup-devices:
    get:
      operationId: listBackupDevices
      summary: The current user's devices that back up, with what the server counts as safe from each
      responses:
        "200":
          description: The devices and how long one may stay quiet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupDeviceList" }
        "401": { $ref: "#/components/responses/Error" }
  /api/me/backup-devices/quiet-days:
    put:
      operationId: setBackupQuietDays
      summary: After how many days without a report a device counts as quiet; 0 never warns
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupQuietDays" }
      responses:
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/me/backup-devices/{id}:
    put:
      operationId: reportBackupDevice
      summary: A device says how its backup is doing, with checksums of files it has seen confirmed
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupDeviceReport" }
      responses:
        "200":
          description: The device as the server now counts it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupDevice" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteBackupDevice
      summary: Take a device off the list. Its photos stay
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/me/backup-devices/{id}/missing:
    get:
      operationId: listBackupDeviceMissing
      summary: What from a device is not safe on the server
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Files that could not be sent, and sent files no longer on the server
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupDeviceMissing" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/admin/backup-devices:
    get:
      operationId: listAllBackupDevices
      summary: Every user's devices that back up
      responses:
        "200":
          description: All devices
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupDeviceList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/admin/upgrade-snapshots:
    get:
      operationId: listUpgradeSnapshots
      summary: Snapshots of the database made before upgrades, newest first
      responses:
        "200":
          description: The snapshots
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UpgradeSnapshot" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/admin/upgrade-snapshots/{name}:
    delete:
      operationId: deleteUpgradeSnapshot
      summary: Delete one snapshot. Going back to it is then no longer possible
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/admin/storage-template:
    get:
      operationId: getStorageTemplate
      summary: How originals are laid out in each user's folder, and what the last run over all of them did
      responses:
        "200":
          description: The template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageTemplate" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      operationId: setStorageTemplate
      summary: Choose the template for new originals. Empty keeps the layout they have always had
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorageTemplateChange" }
      responses:
        "200":
          description: The template as kept
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageTemplate" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/admin/storage-template/preview:
    post:
      operationId: previewStorageTemplate
      summary: Where a template would put a few real originals, without moving anything
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorageTemplateChange" }
      responses:
        "200":
          description: Examples
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/StoragePreview" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/admin/storage-template/apply:
    post:
      operationId: applyStorageTemplate
      summary: Put every uploaded original where the template says, or with dryRun only say what would move
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorageApply" }
      responses:
        "202": { description: Started; the report shows in the template }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/admin/users:
    get:
      operationId: listUsers
      summary: List users
      responses:
        "200":
          description: All users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createUser
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/server/status:
    get:
      operationId: getServerStatus
      summary: The version of this server, whether a newer one exists, and its disk
      responses:
        "200":
          description: Current status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerStatus" }
        "401": { $ref: "#/components/responses/Error" }
  /api/admin/overview:
    get:
      operationId: getAdminOverview
      summary: Live statistics of the whole server, read from the database and the library disk
      responses:
        "200":
          description: Current statistics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOverview" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/assets:
    get:
      operationId: listAssets
      summary: List the current user's most recent assets and their processing status
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: status
          in: query
          schema: { type: string, enum: [processing, ready, failed] }
      responses:
        "200":
          description: Assets, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetList" }
        "401": { $ref: "#/components/responses/Error" }
  /api/assets/bulk:
    post:
      operationId: bulkAssets
      summary: Apply an action to several of the current user's assets. Other assets are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkRequest" }
      responses:
        "200":
          description: How many assets changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/assets/download:
    get:
      operationId: downloadAssets
      summary: Download several originals as one uncompressed ZIP file
      parameters:
        - name: ids
          in: query
          required: true
          description: Comma-separated asset IDs, at most 100
          schema: { type: string }
      responses:
        "200":
          description: ZIP file
          content:
            application/zip:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/assets/{id}:
    get:
      operationId: getAsset
      summary: Read an asset's details and its neighbours on the timeline
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The asset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/assets/{id}/thumbnail:
    get:
      operationId: getAssetThumbnail
      summary: Read a WebP thumbnail
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: size, in: query, description: "source is the unedited picture, for its owner", schema: { type: string, enum: [small, large, full, source], default: small } }
      responses:
        "200":
          description: The thumbnail
          content:
            image/webp:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/assets/{id}/original:
    get:
      operationId: getAssetOriginal
      summary: Read the unmodified original. Supports Range requests for video.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: download, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: The original file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206": { description: Part of the original file }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/assets/{id}/share:
    get:
      operationId: getAssetShare
      summary: >-
        A file to send to other apps or save on a phone. A photo comes as its original, or, when it has
        edits or a smaller one is asked for, as a JPEG of how it looks, without location. A video comes
        as its original.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: small, in: query, schema: { type: boolean, default: false }, description: "A JPEG of at most 2048 px, for messages" }
      responses:
        "200":
          description: The file, with its name in Content-Disposition
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/assets/{id}/motion:
    get:
      operationId: getAssetMotion
      summary: Read the video embedded in an Android Motion Photo
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The video
          content:
            video/mp4:
              schema: { type: string, format: binary }
        "206": { description: Part of the video }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/assets/{id}/video/{file}:
    get:
      operationId: getAssetVideoFile
      summary: Read an HLS playlist or segment, or the scrub strip (sprite.jpg)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: file, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/timeline/buckets:
    get:
      operationId: getTimelineBuckets
      summary: List the months that have photos, newest first
      responses:
        "200":
          description: Months and how many assets each has
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimelineBuckets" }
        "401": { $ref: "#/components/responses/Error" }
  /api/timeline/buckets/{month}:
    get:
      operationId: getTimelineBucket
      summary: List one month's assets, newest first
      parameters:
        - { name: month, in: path, required: true, description: YYYY-MM, schema: { type: string } }
      responses:
        "200":
          description: The month's assets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimelineBucket" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/assets/dates:
    post:
      operationId: fixDates
      summary: Shift, set or zone the dates of many photos, or take them from the files again; with dryRun only show what would change
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DateFix" }
      responses:
        "200":
          description: What changed, or would
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FixResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/assets/locations:
    post:
      operationId: fixLocations
      summary: Set, take away or find the locations of many photos (from nearby photos or a GPX track); with dryRun only show what would change
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationFix" }
      responses:
        "200":
          description: What changed, or would
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FixResult" }
