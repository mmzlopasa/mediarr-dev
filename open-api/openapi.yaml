      required: [light, dark]
      properties:
        light: { type: string }
        dark: { type: string }
    VaultStatus:
      type: object
      required: [hasPin, unlocked]
      properties:
        hasPin: { type: boolean }
        unlocked: { type: boolean }
    VaultPinChange:
      type: object
      required: [pin]
      properties:
        pin: { type: string }
        currentPin: { type: string }
    VaultUnlock:
      type: object
      required: [pin]
      properties:
        pin: { type: string }
    VaultSession:
      type: object
      required: [token]
      properties:
        token: { type: string }
    Tag:
      type: object
      required: [id, name, assetCount]
      properties:
