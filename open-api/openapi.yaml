        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetFacts" }
      responses:
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/assets/{id}/sidecar:
    get:
