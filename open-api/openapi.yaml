    delete:
      operationId: clearAssetEdits
      summary: Go back to the photo as it was taken
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Cleared. New previews follow shortly }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
