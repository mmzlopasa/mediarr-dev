        "200":
          description: Video
          content:
            video/mp4:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
components:
  responses:
    Error:
      description: The request failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Duplicates:
      type: object
      required: [groups, total, pending]
      properties:
        total: { type: integer, description: "All groups, of which at most the first 100 are listed" }
        pending: { type: integer, description: "Photos not compared yet" }
        exactTotal: { type: integer, description: "Groups of the same file or picture" }
        resolving: { $ref: "#/components/schemas/ResolveProgress" }
        groups:
          type: array
          items: { $ref: "#/components/schemas/DuplicateGroup" }
    ResolveProgress:
      type: object
      required: [done, total]
      properties:
        done: { type: integer }
        total: { type: integer }
    DuplicateChoice:
      type: object
      required: [keepId, trashIds]
      properties:
        keepId: { type: string, format: uuid }
        trashIds: { type: array, items: { type: string, format: uuid }, minItems: 1, maxItems: 50 }
    DuplicateResolve:
      type: object
      properties:
        groups: { type: array, items: { $ref: "#/components/schemas/DuplicateChoice" }, maxItems: 100 }
        all: { type: boolean, description: "Every group, each by its proposal" }
        exactOnly: { type: boolean, description: "With all: only groups of the same file or picture" }
        dryRun: { type: boolean }
    DuplicateResolveResult:
      type: object
      required: [groups, trashed, freedBytes, background]
      properties:
        groups: { type: integer }
        trashed: { type: integer }
        freedBytes: { type: integer, format: int64 }
        background: { type: boolean }
    CleanupCategoryId:
      type: string
      enum: [blurry, screenshots, largeVideos, bursts]
    CleanupCategory:
      type: object
      required: [id, count, bytes]
      properties:
        id: { $ref: "#/components/schemas/CleanupCategoryId" }
        count: { type: integer, format: int64 }
        bytes: { type: integer, format: int64 }
    CleanupSummary:
      type: object
      required: [categories, pending]
      properties:
        categories: { type: array, items: { $ref: "#/components/schemas/CleanupCategory" } }
        pending: { type: integer, format: int64, description: "Photos whose sharpness is not measured yet" }
    CleanupItem:
      type: object
      required: [id, originalName, sizeBytes, kind, ratio, localAt, favorite, inAlbum]
      properties:
        id: { type: string, format: uuid }
        originalName: { type: string }
        sizeBytes: { type: integer, format: int64 }
        kind: { type: string, enum: [photo, video] }
        width: { type: integer }
        height: { type: integer }
        ratio: { type: number, format: float }
        localAt: { type: string }
        favorite: { type: boolean }
        inAlbum: { type: boolean }
        durationMs: { type: integer, format: int64 }
    CleanupPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CleanupItem" } }
        nextOffset: { type: integer }
    DuplicateGroup:
      type: object
      required: [items, keepId, exact, freedBytes]
      properties:
        keepId: { type: string, format: uuid, description: "The best one, proposed to keep" }
        exact: { type: boolean, description: "The same file or the same picture, not only alike" }
        freedBytes: { type: integer, format: int64, description: "What moving the others to the trash frees, once it is emptied" }
        items:
          type: array
          items: { $ref: "#/components/schemas/DuplicateItem" }
    DuplicateItem:
      type: object
      required: [id, originalName, sizeBytes, ratio, localAt, favorite, original, resaved, hasDate, hasLocation, hasCaption]
      properties:
        favorite: { type: boolean }
        original: { type: boolean, description: "A camera's own format, such as HEIC, RAW or ProRes" }
        resaved: { type: boolean, description: "Saved again by an app, such as a WhatsApp copy" }
        hasDate: { type: boolean }
        hasLocation: { type: boolean }
        hasCaption: { type: boolean }
        id: { type: string, format: uuid }
        originalName: { type: string }
        sizeBytes: { type: integer, format: int64 }
        width: { type: integer }
        height: { type: integer }
        ratio: { type: number, format: float }
        localAt: { type: string }
    ExternalLibrary:
      type: object
      required: [available, assets, missing, scanning]
      properties:
        available: { type: boolean, description: "A folder was given in .env and can be read" }
        ownerId: { type: string, format: uuid }
        assets: { type: integer, format: int64 }
        missing: { type: integer, format: int64, description: "Records whose file was not found. They are kept" }
        scanning: { type: boolean }
        scanFinishedAt: { type: string, format: date-time }
        scanError: { type: string }
    ExternalLibraryOwner:
      type: object
      required: [ownerId]
      properties:
        ownerId: { type: string, format: uuid }
    Folder:
      type: object
      required: [available, path, folders, items]
      properties:
        available: { type: boolean, description: "This user owns an external library" }
        path: { type: string }
        folders:
          type: array
          items: { $ref: "#/components/schemas/FolderEntry" }
        items:
          type: array
          items: { $ref: "#/components/schemas/TimelineItem" }
    FolderEntry:
      type: object
      required: [name, count, coverId]
      properties:
        name: { type: string }
        count: { type: integer, format: int64, description: "Photos anywhere inside it" }
        coverId: { type: string, format: uuid }
    AssetEdits:
      type: object
      properties:
        rotate: { type: integer, description: "Clockwise: 0, 90, 180 or 270" }
        crop: { $ref: "#/components/schemas/CropBox" }
        brightness: { type: integer, minimum: -100, maximum: 100 }
        contrast: { type: integer, minimum: -100, maximum: 100 }
        saturation: { type: integer, minimum: -100, maximum: 100 }
        filter: { type: string, enum: [mono, warm, cool, vintage, vivid] }
    CropBox:
      type: object
      description: A part of the rotated picture, in fractions of its sides
      required: [x, y, width, height]
      properties:
        x: { type: number, format: double }
        y: { type: number, format: double }
        width: { type: number, format: double }
        height: { type: number, format: double }
    AuditEntry:
      type: object
      required: [id, at, userEmail, method, route, target, status, ip]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        userEmail: { type: string }
        method: { type: string }
        route: { type: string }
        target: { type: string }
        status: { type: integer }
        ip: { type: string }
    ApiKey:
      type: object
      required: [id, name, scopes, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        scopes: { type: array, items: { type: string, enum: [read, upload, write, admin] } }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    ApiKeyCreate:
      type: object
      required: [name, scopes]
      properties:
        name: { type: string }
        scopes: { type: array, items: { type: string, enum: [read, upload, write, admin] } }
        expiresInDays: { type: integer, minimum: 1, maximum: 3650 }
    AdminJobs:
      type: object
      required: [queues, failed]
      properties:
        queues: { type: array, items: { $ref: "#/components/schemas/JobQueue" } }
        failed: { type: array, items: { $ref: "#/components/schemas/FailedJob" } }
    JobQueue:
      type: object
      required: [name, paused, queued, running]
      properties:
        name: { type: string }
        paused: { type: boolean }
        queued: { type: integer, format: int64 }
        running: { type: integer, format: int64 }
    FailedJob:
      type: object
      required: [id, kind, queue, error, at]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string }
        queue: { type: string }
        error: { type: string }
        at: { type: string, format: date-time }
    AdminHealth:
      type: object
      required: [workerRunning, mlEnabled, databaseBytes]
      properties:
        workerRunning: { type: boolean }
        workerLastSeen: { type: string, format: date-time }
        mlEnabled: { type: boolean }
        mlRunning: { type: boolean }
        databaseBytes: { type: integer, format: int64 }
    UserStorage:
      type: object
      required: [id, name, email, storedBytes, assets]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        storedBytes: { type: integer, format: int64 }
        assets: { type: integer, format: int64 }
        quotaBytes: { type: integer, format: int64 }
    QuotaUpdate:
      type: object
      properties:
        quotaBytes: { type: integer, format: int64 }
    TrashSummary:
      type: object
      required: [assets, bytes]
      properties:
        assets: { type: integer, format: int64 }
        bytes: { type: integer, format: int64 }
    AuthMethods:
      type: object
      required: [passkeys, passwordLogin, loginMessage, passwordReset, maintenance]
      properties:
        maintenance: { type: boolean }
        passwordReset: { type: boolean, description: "A forgotten password can be reset by email" }
        passwordLogin: { type: boolean }
        loginMessage: { type: string }
        passkeys: { type: boolean, description: "This address can use passkeys: HTTPS and a domain name" }
        ssoLabel: { type: string, description: "The name of the single sign-on button, if it is turned on" }
    QRSignIn:
      type: object
      required: [id, code, link, expiresAt]
      properties:
        id: { type: string }
        code: { type: string, description: "Eight characters, shown as XXXX-XXXX for typing by hand" }
        link: { type: string, description: "mediarr://sign-in?server=...&code=..., the contents of the QR code" }
        server: { type: string, description: "The address the code was made on" }
        expiresAt: { type: string, format: date-time }
    QRSignInState:
      type: object
      required: [status, expiresAt]
      properties:
        status: { type: string, enum: [waiting, requested, allowed, denied, used, expired] }
        device: { type: string, description: "What the device that scanned the code calls itself" }
        expiresAt: { type: string, format: date-time }
    QRAnswer:
      type: object
      required: [allow]
      properties:
        allow: { type: boolean }
    QRRedeem:
      type: object
      required: [code, device]
      properties:
        code: { type: string }
        device: { type: string, maxLength: 80 }
    QRTicket:
      type: object
      required: [ticket]
      properties:
        ticket: { type: string }
    ServerHello:
      type: object
      required: [app, version]
      properties:
        app: { type: string, enum: [mediarr] }
        version: { type: string }
    OIDCExchange:
      type: object
      required: [code, verifier]
      properties:
        code: { type: string }
        verifier: { type: string }
    OIDCSettings:
      type: object
      required: [issuer, clientId, label, autoCreate, hasSecret, linkAdmins]
      properties:
        issuer: { type: string }
        clientId: { type: string }
        label: { type: string }
        autoCreate: { type: boolean, description: "A person without an account gets one on first sign-in" }
        linkAdmins: { type: boolean, description: "Also link administrators by email. Off is safer" }
        hasSecret: { type: boolean }
    OIDCSettingsUpdate:
      type: object
      required: [issuer, clientId, label, autoCreate]
      properties:
        issuer: { type: string }
        clientId: { type: string }
        label: { type: string }
        autoCreate: { type: boolean }
        secret: { type: string, description: "Left out keeps the one that is saved" }
        linkAdmins: { type: boolean }
    Passkey:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
    ImportCreate:
      type: object
      required: [source, ownerId]
      properties:
        source: { type: string, enum: [immich, takeout, icloud] }
        ownerId: { type: string, format: uuid, description: "Whose library it goes into" }
        address: { type: string, description: "Immich only" }
        apiKey: { type: string, description: "Immich only. Forgotten when the import ends" }
        folder: { type: string, description: "Takeout and iCloud: an unpacked folder inside the external library's mount" }
    UserImportCreate:
      type: object
      required: [source]
      properties:
        source: { type: string, enum: [takeout, icloud] }
    ImportPart:
      type: object
      required: [id, name, size]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        size: { type: integer, format: int64 }
    UserImport:
      type: object
      required: [id, source, status, fromZip, parts, total, added, skipped, failed, lastError, createdAt]
      properties:
        id: { type: string, format: uuid }
        source: { type: string, enum: [immich, takeout, icloud] }
        status: { type: string, enum: [uploading, running, done, failed, cancelled] }
        fromZip: { type: boolean }
        parts: { type: array, items: { $ref: "#/components/schemas/ImportPart" } }
        total: { type: integer, description: "Files found, known once the import has read its ZIP files" }
        added: { type: integer }
        skipped: { type: integer, description: "Already there, or deleted at the source" }
        failed: { type: integer }
        lastError: { type: string }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    ImportProblem:
      type: object
      required: [name, reason]
      properties:
        name: { type: string }
        reason: { type: string }
    ImportDetail:
      allOf:
        - $ref: "#/components/schemas/UserImport"
        - type: object
          required: [userEmail, problems]
          properties:
            userEmail: { type: string }
            problems: { type: array, items: { $ref: "#/components/schemas/ImportProblem" } }
    ImportEntry:
      type: object
      required: [id, userEmail, source, status, fromZip, total, added, skipped, failed, lastError, createdAt]
      properties:
        id: { type: string, format: uuid }
        userEmail: { type: string }
        source: { type: string, enum: [immich, takeout, icloud] }
        status: { type: string, enum: [uploading, running, done, failed, cancelled] }
        fromZip: { type: boolean, description: "Uploaded as ZIP files by the user, not from a folder" }
        total: { type: integer }
        added: { type: integer }
        skipped: { type: integer, description: "Already there, or deleted at the source" }
        failed: { type: integer }
        lastError: { type: string }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    Features:
      type: object
      additionalProperties: { type: boolean }
    FeatureUpdate:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    BackupSettings:
      type: object
      required: [repository, hour, hasPassword, hasS3Key, localFolder]
      properties:
        repository: { type: string }
        hour: { type: integer, description: "The hour of the day, by the server's clock" }
        hasPassword: { type: boolean }
        hasS3Key: { type: boolean }
        localFolder: { type: string, description: "Where BACKUP_PATH from .env is mounted" }
    BackupSettingsUpdate:
      type: object
      required: [repository, hour]
      properties:
        repository: { type: string }
        hour: { type: integer }
        password: { type: string }
        s3Key: { type: string }
        s3Secret: { type: string }
    KeepGuest:
      type: object
      required: [id, name, status, quotaBytes, usedBytes, deletedBytes, address, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [invited, active, stopped] }
        quotaBytes: { type: integer, format: int64 }
        usedBytes: { type: integer, format: int64, description: "Everything kept, what it deleted included" }
        deletedBytes: { type: integer, format: int64, description: "What it deleted, kept for 90 days" }
        address: { type: string, description: "The address of this server the guest was told" }
        inviteExpiresAt: { type: string, format: date-time }
        lastBackupAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    KeepGuestCreate:
      type: object
      required: [name, quotaBytes, address]
      properties:
        name: { type: string }
        quotaBytes: { type: integer, format: int64 }
        address: { type: string, description: "Where the guest reaches this server, as http(s)://host[:port]" }
    KeepGuestUpdate:
      type: object
      required: [quotaBytes, status]
      properties:
        quotaBytes: { type: integer, format: int64 }
        status: { type: string, enum: [active, stopped] }
    KeepInvite:
      type: object
      required: [guest, code, expiresAt]
      properties:
        guest: { $ref: "#/components/schemas/KeepGuest" }
        code: { type: string, description: "Given to the guest's administrator. Shown once" }
        expiresAt: { type: string, format: date-time }
    KeepRestored:
      type: object
      required: [restored]
      properties:
        restored: { type: integer }
    KeepPairRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    KeepPairing:
      type: object
      required: [guestId, secret, name, quotaBytes]
      properties:
        guestId: { type: string, format: uuid }
        secret: { type: string }
        name: { type: string }
        quotaBytes: { type: integer, format: int64 }
    BackupDestination:
      type: object
      required: [id, name, address, quotaBytes, lastError, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        address: { type: string }
        quotaBytes: { type: integer, format: int64 }
        lastSuccessAt: { type: string, format: date-time }
        lastError: { type: string }
        createdAt: { type: string, format: date-time }
    BackupDestinationCreate:
      type: object
      required: [code]
      properties:
        code: { type: string, description: "The code from the other server's administrator" }
    BackupRunRequest:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [backup, restore_test] }
        destinationId: { type: string, format: uuid, description: "Only this copy at another Mediarr. Without it, a backup goes everywhere and a test uses the backup in the settings" }
    BackupRun:
      type: object
      required: [id, kind, status, message, files, startedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [backup, restore_test] }
        status: { type: string, enum: [running, done, failed] }
        message: { type: string }
        files: { type: integer, format: int64 }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        destinationId: { type: string, format: uuid }
        destinationName: { type: string, description: "The other Mediarr it went to; none for the backup in the settings" }
    Documents:
      type: object
      required: [enabled, analysisOn, items]
      properties:
        enabled: { type: boolean, description: "The administrator has turned this on" }
        analysisOn: { type: boolean, description: "Picture analysis runs, without which no text is read" }
        items: { type: array, items: { $ref: "#/components/schemas/TimelineItem" } }
    Webhook:
      type: object
      required: [id, url, events, lastStatus, lastError]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        events: { type: array, items: { type: string, enum: [asset.ready, person.created, backup.finished] } }
        lastStatus: { type: integer }
        lastError: { type: string }
        lastAt: { type: string, format: date-time }
    WebhookCreate:
      type: object
      required: [url, events]
      properties:
        url: { type: string }
        events: { type: array, items: { type: string, enum: [asset.ready, person.created, backup.finished] } }
    WebhookCreated:
      type: object
      required: [id, secret]
      properties:
        id: { type: string, format: uuid }
        secret: { type: string }
    Family:
      type: object
      required: [enabled, member, members, rules]
      properties:
        enabled: { type: boolean }
        member: { type: boolean }
        members: { type: array, items: { $ref: "#/components/schemas/UserRef" } }
        rules: { type: array, items: { $ref: "#/components/schemas/FamilyRule" } }
    FamilyRule:
      type: object
      required: [id, title, rules]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        rules: { $ref: "#/components/schemas/AlbumRules" }
    FamilyRuleCreate:
      type: object
      required: [title, rules]
      properties:
        title: { type: string }
        rules: { $ref: "#/components/schemas/AlbumRules" }
    AskRequest:
      type: object
      required: [question]
      properties:
        question: { type: string }
    AskAnswer:
      type: object
      required: [query]
      properties:
        query: { type: string }
    AISettings:
      type: object
      required: [address, visionModel, textModel, reachable, modelsReady, described, total]
      properties:
        address: { type: string }
        visionModel: { type: string }
        textModel: { type: string }
        reachable: { type: boolean }
        modelsReady: { type: boolean }
        described: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
    AISettingsUpdate:
      type: object
      required: [address, visionModel, textModel]
      properties:
        address: { type: string }
        visionModel: { type: string }
        textModel: { type: string }
    Memory:
      type: object
      required: [kind, title, items]
      properties:
        kind: { type: string, enum: [on_this_day, week] }
        year: { type: integer, description: "The year, for on_this_day" }
        title: { type: string, description: "A date or date span. The client words the rest." }
        items: { type: array, items: { $ref: "#/components/schemas/TimelineItem" } }
    StoryRequest:
      type: object
      required: [title, ids]
      properties:
        title: { type: string }
        ids: { type: array, items: { type: string, format: uuid } }
    StoryExport:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [working, ready, failed] }
    SearchResult:
      type: object
      required: [items, smart, filters]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/TimelineItem" } }
        smart: { type: boolean, description: "False when picture search is not turned on or did not answer" }
        filters: { $ref: "#/components/schemas/SearchFilters" }
    SearchFilters:
      type: object
      description: Every filter the search used, those asked for and those found in the words.
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        person: { type: string, description: "The name of a person found in the words" }
        people: { type: array, items: { $ref: "#/components/schemas/PersonRef" } }
        peopleMatch: { type: string, enum: [all, any] }
        place: { type: string }
        camera: { type: string }
        lens: { type: string }
        type: { type: string, enum: [photo, video] }
        minRating: { type: integer }
        tags: { type: array, items: { type: string } }
        album: { $ref: "#/components/schemas/AlbumRef" }
        notInAlbum: { type: boolean }
        favorite: { type: boolean }
        words: { type: string, description: "What is left of the query after the filters were taken out" }
    AlbumRef:
