        - { name: scope, in: path, required: true, schema: { type: string, enum: [favorites, archive, trash, vault, recent] } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The asset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/collections/{scope}/assets/{id}/thumbnail:
    get:
      operationId: getCollectionThumbnail
      summary: A preview of an asset in a collection
      parameters:
        - { name: scope, in: path, required: true, schema: { type: string, enum: [favorites, archive, trash, vault, recent] } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: size
          in: query
          schema: { type: string, enum: [small, large, full], default: small }
      responses:
        "200":
          description: Image
          content:
            image/webp:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/collections/{scope}/assets/{id}/original:
    get:
      operationId: getCollectionOriginal
      summary: The original of an asset in a collection
      parameters:
        - { name: scope, in: path, required: true, schema: { type: string, enum: [favorites, archive, trash, vault, recent] } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: download, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: File
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/collections/{scope}/assets/{id}/motion:
    get:
      operationId: getCollectionMotion
      summary: The video inside a Motion Photo in a collection
      parameters:
        - { name: scope, in: path, required: true, schema: { type: string, enum: [favorites, archive, trash, vault, recent] } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Video
          content:
            video/mp4:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/collections/{scope}/assets/{id}/video/{file}:
    get:
      operationId: getCollectionVideoFile
      summary: HLS files of a video in a collection
      parameters:
        - { name: scope, in: path, required: true, schema: { type: string, enum: [favorites, archive, trash, vault, recent] } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: file, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: File
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/trash/empty:
    post:
      operationId: emptyTrash
      summary: Permanently delete everything in the trash
      responses:
        "200":
          description: How many were deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkResponse" }
        "401": { $ref: "#/components/responses/Error" }
  /api/vault/status:
    get:
      operationId: getVaultStatus
      summary: Whether the vault has a PIN and is unlocked
      responses:
        "200":
          description: The state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VaultStatus" }
        "401": { $ref: "#/components/responses/Error" }
  /api/vault/pin:
    post:
      operationId: setVaultPin
      summary: Set the vault PIN. Changing it needs the current one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VaultPinChange" }
      responses:
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/vault/unlock:
    post:
      operationId: unlockVault
      summary: Unlock the vault for a short time
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VaultUnlock" }
      responses:
        "200":
          description: Unlocked. The token is for clients that cannot keep the cookie.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VaultSession" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/vault/lock:
    post:
      operationId: lockVault
      summary: Lock the vault again
      responses:
        "204": { description: Locked }
        "401": { $ref: "#/components/responses/Error" }
  /api/tags:
    get:
      operationId: listTags
      summary: The current user's tags
      responses:
        "200":
          description: Tags
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Tag" } }
        "401": { $ref: "#/components/responses/Error" }
  /api/tags/{id}:
    patch:
      operationId: renameTag
      summary: Rename a tag. When another tag already has the name, merge says to join the two
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TagRename" }
      responses:
        "200":
          description: The tag with its new name, or the one it was joined to
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteTag
      summary: Delete a tag. The photos stay.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/tags/{id}/buckets:
    get:
      operationId: getTagBuckets
      summary: Months with photos carrying a tag
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Months
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimelineBuckets" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/tags/{id}/buckets/{month}:
    get:
      operationId: getTagBucket
      summary: Photos carrying a tag in one month
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: month, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Assets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimelineBucket" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/assets/tags:
    post:
      operationId: changeAssetTags
      summary: Add a tag to the user's own assets, or remove it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetTagChange" }
      responses:
        "200":
          description: How many changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/map/points:
    get:
      operationId: getMapPoints
      summary: Photos with a location that this user may see, oldest first
      parameters:
        - { name: from, in: query, description: "A day as YYYY-MM-DD", schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$', example: '2026-11-06' } }
        - { name: to, in: query, description: "A day as YYYY-MM-DD", schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$', example: '2026-11-06' } }
      responses:
        "200":
          description: Parallel lists, which stay small for a large library
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapPoints" }
        "401": { $ref: "#/components/responses/Error" }
  /api/map/trips:
    get:
      operationId: getMapTrips
      summary: Journeys found from the time and distance between photos
      responses:
        "200":
          description: Trips, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Trip" } }
        "401": { $ref: "#/components/responses/Error" }
  /api/map/style:
    get:
      operationId: getMapStyle
      summary: Where the map's background comes from
      responses:
        "200":
          description: Style addresses
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapStyle" }
        "401": { $ref: "#/components/responses/Error" }
    put:
      operationId: setMapStyle
      summary: Choose the map's background. Administrators only. Empty goes back to the default.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MapStyle" }
      responses:
        "200":
          description: Style addresses
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapStyle" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/search:
    get:
      operationId: searchAssets
      summary: >-
        Search in natural language, with filters, or with filters alone. Dates, people, places and
        cameras in the query become filters, which the answer lists.
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }, description: "The first day, as YYYY-MM-DD" }
        - { name: to, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }, description: "The last day, included, as YYYY-MM-DD" }
        - { name: person, in: query, schema: { type: array, items: { type: string, format: uuid } }, style: form, explode: true }
        - { name: people, in: query, schema: { type: string, enum: [all, any], default: all }, description: "All of them on the picture, or any of them" }
        - { name: place, in: query, schema: { type: string } }
        - { name: camera, in: query, schema: { type: string } }
        - { name: lens, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string, enum: [photo, video] } }
        - { name: minRating, in: query, schema: { type: integer, minimum: 1, maximum: 5 } }
        - { name: tag, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: album, in: query, schema: { type: string, format: uuid }, description: "Only in this album, which may be shared with the user" }
        - { name: notInAlbum, in: query, schema: { type: boolean } }
        - { name: favorite, in: query, schema: { type: boolean } }
        - { name: plain, in: query, schema: { type: boolean }, description: "Take no filters from the words: every word is looked for as it is" }
      responses:
        "200":
          description: Results, best first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/search/options:
    get:
      operationId: getSearchOptions
      summary: The cameras, lenses, places and tags in the user's library, to choose from in the filters
      responses:
        "200":
          description: The choices
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchOptions" }
        "401": { $ref: "#/components/responses/Error" }
  /api/people:
    get:
      operationId: listPeople
      summary: People recognised in the current user's library
      responses:
        "200":
          description: People
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeopleList" }
        "401": { $ref: "#/components/responses/Error" }
  /api/people/{id}:
    patch:
      operationId: updatePerson
      summary: Name or hide a person
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersonUpdate" }
      responses:
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/assets/{id}/faces:
    get:
      operationId: listAssetFaces
      summary: The faces found in a picture of the signed-in user
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Faces
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetFaces" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/faces/{id}:
    put:
      operationId: assignFace
      summary: Say who this face is. Analysing the picture again keeps it
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FaceAssign" }
      responses:
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeFace
      summary: Say this is not a person. Analysing the picture again does not bring it back
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/people/{id}/merge:
    post:
      operationId: mergePeople
      summary: Treat other people as this one
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetIds" }
      responses:
        "204": { description: Merged }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/people/{id}/thumbnail:
    get:
      operationId: getPersonThumbnail
      summary: A picture of this person's face
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Image
          content:
            image/webp:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/people/{id}/buckets:
    get:
      operationId: getPersonBuckets
      summary: Months with this person
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Months
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimelineBuckets" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/people/{id}/buckets/{month}:
    get:
      operationId: getPersonBucket
      summary: Photos of this person in one month
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: month, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Assets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimelineBucket" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/admin/analysis:
    get:
      operationId: getAnalysisProgress
      summary: How far picture analysis has come. Administrators only.
      responses:
        "200":
          description: Progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalysisProgress" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/assets/{id}/stack:
    delete:
      operationId: dissolveStack
      summary: Split a stack back into single shots. It is not put together again by itself
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Split }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/assets/{id}/stack/main:
    put:
      operationId: setStackMain
      summary: Make this shot the one the timeline shows
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Changed }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/duplicates:
    get:
      operationId: listDuplicates
      summary: Groups of photos that look alike. Only a proposal, nothing is removed without asking
      responses:
        "200":
          description: The groups, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Duplicates" }
        "401": { $ref: "#/components/responses/Error" }
  /api/duplicates/dismiss:
    post:
      operationId: dismissDuplicates
      summary: These photos are not duplicates of each other, and are not proposed again
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetIds" }
      responses:
        "204": { description: Dismissed }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/duplicates/resolve:
    post:
      operationId: resolveDuplicates
      summary: Keeps one photo of each group, gives it what the others had, and moves the others to the trash
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DuplicateResolve" }
      responses:
        "200":
          description: Done, or what would be done
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DuplicateResolveResult" }
        "202":
          description: Many groups; they are resolved in the background
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DuplicateResolveResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/cleanup:
    get:
      operationId: getCleanup
      summary: How many of my photos and videos each kind of clean-up would offer, and their size
      parameters:
        - { name: blur, in: query, description: "How strict: 1 offers only the blurriest, 5 the most", schema: { type: integer, minimum: 1, maximum: 5 } }
        - { name: videoMb, in: query, description: "Videos at least this large", schema: { type: integer, enum: [250, 500, 1000, 2000] } }
      responses:
        "200":
          description: The counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CleanupSummary" }
        "401": { $ref: "#/components/responses/Error" }
  /api/cleanup/keep:
    post:
      operationId: keepFromCleanup
      summary: These stay, and clean-up does not offer them again
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetIds" }
      responses:
        "204": { description: Kept }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/cleanup/{category}:
    get:
      operationId: listCleanup
      summary: The photos or videos of one kind of clean-up, a page at a time
      parameters:
        - { name: category, in: path, required: true, schema: { $ref: "#/components/schemas/CleanupCategoryId" } }
        - { name: blur, in: query, schema: { type: integer, minimum: 1, maximum: 5 } }
        - { name: videoMb, in: query, schema: { type: integer, enum: [250, 500, 1000, 2000] } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CleanupPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/admin/audit:
    get:
      operationId: listAuditLog
      summary: Who changed what, newest first. Never the content of a request
      parameters:
        - { name: before, in: query, description: "Entries older than this id", schema: { type: integer, format: int64 } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200":
          description: The entries
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/admin/server-settings:
    get:
      operationId: getServerSettings
      summary: How this server treats files, and sign-in
      responses:
        "200":
          description: The settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerSettings" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      operationId: setServerSettings
      summary: Change them. Applies to files processed from now on
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServerSettings" }
      responses:
        "200":
          description: The settings now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerSettings" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/admin/email:
    get:
      operationId: getEmailSettings
      summary: The mail server this server sends through
      responses:
        "200":
          description: The settings, without the password
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailSettings" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      operationId: setEmailSettings
      summary: Change the mail server
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailSettingsUpdate" }
      responses:
        "200":
          description: The settings now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailSettings" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/admin/email/test:
