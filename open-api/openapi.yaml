        "403": { $ref: "#/components/responses/Error" }
    put:
      operationId: setSecurity
      summary: Change the rules. Refused if it would lock out the person asking
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecurityUpdate" }
      responses:
        "200":
          description: The rules now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecuritySettings" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/admin/security/events:
    get:
      operationId: listSecurityEvents
      summary: Attempts to get in, newest first
      parameters:
        - { name: before, in: query, description: "Entries older than this one", schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: The attempts
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SecurityEvent" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/admin/security/devices/{id}/approve:
    post:
      operationId: approveDevice
      summary: Let this device sign in
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Approved }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/admin/security/devices/{id}:
    delete:
      operationId: deleteDevice
      summary: Forget this device, which then has to be approved again
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Forgotten }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/admin/jobs:
    get:
      operationId: getAdminJobs
      summary: The job queues, and the jobs that gave up
      responses:
        "200":
          description: Queues and failed jobs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminJobs" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/admin/jobs/queues/{queue}/pause:
    post:
      operationId: pauseJobQueue
      summary: Stop starting jobs from this queue
      parameters:
        - { name: queue, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Paused }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/admin/jobs/queues/{queue}/resume:
    post:
      operationId: resumeJobQueue
      summary: Continue a paused queue
      parameters:
        - { name: queue, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Resumed }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/admin/jobs/{id}/retry:
    post:
      operationId: retryJob
      summary: Try a failed job again
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: Queued again }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/admin/health:
    get:
      operationId: getAdminHealth
      summary: Whether the worker and the analysis service are running
      responses:
        "200":
          description: The state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminHealth" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/admin/storage:
    get:
      operationId: getAdminStorage
      summary: How much each user stores
      responses:
        "200":
          description: One row per user, the largest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/UserStorage" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/admin/users/{id}/quota:
    put:
      operationId: setUserQuota
      summary: Set how much a user may store. Without a value there is no limit
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuotaUpdate" }
      responses:
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/trash/summary:
    get:
      operationId: getTrashSummary
      summary: What emptying the trash would remove
      responses:
        "200":
          description: Count and size
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrashSummary" }
        "401": { $ref: "#/components/responses/Error" }
  /api/auth/methods:
    get:
      operationId: getAuthMethods
      summary: The ways of signing in that this address offers, besides a password
      responses:
        "200":
          description: The methods
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthMethods" }
  /api/auth/oidc/start:
    get:
      operationId: startOIDC
      summary: Go to the identity provider
      parameters:
        - { name: next, in: query, schema: { type: string } }
        - { name: appChallenge, in: query, description: "SHA-256 of a secret the app keeps, base64url", schema: { type: string } }
      responses:
        "302": { description: To the provider }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /api/auth/oidc/callback:
    get:
      operationId: finishOIDC
      summary: Where the identity provider sends the browser back
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        "302": { description: "Into the library, or back to sign-in" }
  /api/auth/oidc/exchange:
    post:
      operationId: exchangeOIDC
      summary: The app turns a one-time code into a session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OIDCExchange" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/admin/oidc:
    get:
      operationId: getOIDCSettings
      summary: Single sign-on settings, without the secret
      responses:
        "200":
          description: The settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OIDCSettings" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      operationId: setOIDCSettings
      summary: Change single sign-on. An empty issuer turns it off
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OIDCSettingsUpdate" }
      responses:
        "200":
          description: The settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OIDCSettings" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/me/passkeys:
    get:
      operationId: listPasskeys
      summary: The current user's passkeys
      responses:
        "200":
          description: The passkeys
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Passkey" } }
        "401": { $ref: "#/components/responses/Error" }
  /api/me/passkeys/{id}:
    delete:
      operationId: deletePasskey
      summary: Remove a passkey
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Error" }
  /api/me/passkeys/begin:
    post:
      operationId: beginPasskeyRegistration
      summary: Start adding a passkey, which takes the account's password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordConfirm" }
      responses:
        "200":
          description: The answer
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "204": { description: Done }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/me/passkeys/finish:
    post:
      operationId: finishPasskeyRegistration
      summary: Finish adding a passkey
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: The answer
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "204": { description: Done }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/auth/passkey/begin:
    post:
      operationId: beginPasskeyLogin
      summary: Start signing in with a passkey
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: The answer
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "204": { description: Done }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/auth/passkey/finish:
    post:
      operationId: finishPasskeyLogin
      summary: Finish signing in with a passkey
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: The answer
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "204": { description: Done }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/auth/qr:
    post:
      operationId: createQRSignIn
      summary: A one-time code that lets another device sign in to this account once I allow it
      responses:
        "200":
          description: The code, valid for five minutes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QRSignIn" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/auth/qr/{id}:
    get:
      operationId: getQRSignIn
      summary: Whether a device has scanned my code and is waiting for an answer
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QRSignInState" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/auth/qr/{id}/answer:
    post:
      operationId: answerQRSignIn
      summary: Allow or deny the device that scanned my code
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QRAnswer" }
      responses:
        "204": { description: Answered }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/auth/qr/redeem:
    post:
      operationId: redeemQRSignIn
      summary: A new device hands in a scanned code and gets a ticket to wait with
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QRRedeem" }
      responses:
        "200":
          description: Waiting for the signed-in device to answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QRTicket" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/auth/qr/wait:
    post:
      operationId: waitQRSignIn
      summary: Waits up to 25 seconds for the answer; when allowed, this device is signed in
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QRTicket" }
      responses:
        "200":
          description: Allowed and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "202": { description: Not answered yet; ask again }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
