        name: { type: string }
        hidden: { type: boolean }
        birthDate: { type: string, description: "YYYY-MM-DD, when it is known" }
        assetCount: { type: integer, format: int64 }
    PeopleList:
      type: object
      required: [enabled, people]
      properties:
        enabled: { type: boolean, description: "False when face recognition is not turned on" }
        people: { type: array, items: { $ref: "#/components/schemas/Person" } }
    PersonRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    ExplorePlace:
      type: object
      required: [name, country, assetCount, coverId]
      properties:
        name: { type: string }
        country: { type: string }
        assetCount: { type: integer, format: int64 }
        coverId: { type: string, format: uuid }
    ExplorePlaces:
      type: object
      required: [places]
      properties:
        places: { type: array, items: { $ref: "#/components/schemas/ExplorePlace" } }
    AssetFacts:
      type: object
      properties:
