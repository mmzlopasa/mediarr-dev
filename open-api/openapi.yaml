        "202": { description: Started }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/admin/backup/destinations:
    get:
      operationId: listBackupDestinations
      summary: Other Mediarr servers that keep a copy of this one's backup, besides the backup in the settings
      responses:
        "200":
          description: The destinations
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/BackupDestination" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: addBackupDestination
      summary: Pair with another Mediarr server by the code it gave, so that it keeps a copy of the backup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupDestinationCreate" }
      responses:
        "201":
          description: Paired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupDestination" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /api/admin/backup/destinations/{id}:
    delete:
      operationId: removeBackupDestination
      summary: Stop sending a copy there. What it keeps stays with it
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/admin/keep/guests:
    get:
      operationId: listKeepGuests
      summary: Other Mediarr servers whose encrypted backup this one keeps
      responses:
        "200":
          description: The guests
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/KeepGuest" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: inviteKeepGuest
      summary: Invite another Mediarr server to keep its backup here. The code is shown once and works once, within seven days
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeepGuestCreate" }
      responses:
        "201":
          description: Invited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeepInvite" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/admin/keep/guests/{id}:
    patch:
      operationId: updateKeepGuest
      summary: Change how much a guest may keep here, or stop and start taking its backup
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeepGuestUpdate" }
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeepGuest" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeKeepGuest
      summary: Delete a guest and everything kept for it. The name must be given again, as a confirmation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: name, in: query, required: false, schema: { type: string } }
      responses:
        "204": { description: Removed }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/admin/keep/guests/{id}/invite:
    post:
      operationId: reinviteKeepGuest
      summary: A new code for a guest that has not paired yet
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The new code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeepInvite" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/admin/keep/guests/{id}/restore-deleted:
    post:
      operationId: restoreKeepGuestDeleted
      summary: Put back what the guest deleted in the last 90 days, after an attack or a mistake
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: How many files came back
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeepRestored" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/keep/pair:
    post:
      operationId: pairKeepGuest
      summary: >-
        Another Mediarr server pairs with the token of its invitation and gets its credentials, once.
        After that it sends its encrypted backup over the restic REST protocol to /api/keep/{guestId}/,
        with HTTP Basic credentials. That protocol is served apart from this API and is not listed here.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeepPairRequest" }
      responses:
        "200":
          description: Paired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeepPairing" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/admin/webhooks:
    get:
      operationId: listWebhooks
      summary: Addresses told about events, without their secrets
      responses:
        "200":
          description: The webhooks
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Webhook" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createWebhook
      summary: Add an address. Its signing secret is shown only once
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookCreated" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/admin/webhooks/{id}:
    delete:
      operationId: deleteWebhook
      summary: Stop telling this address
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/admin/webhooks/{id}/test:
    post:
      operationId: testWebhook
      summary: Send a test event now
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "202": { description: Queued }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/family:
