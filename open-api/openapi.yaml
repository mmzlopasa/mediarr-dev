      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The import
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteImport
      summary: Remove an import and its ZIP files. What it brought in stays
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/imports/{id}/start:
    post:
      operationId: startImport
      summary: Bring in the uploaded files, or go on with an import that was stopped
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Started }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/imports/{id}/stop:
    post:
      operationId: stopImport
      summary: Stop an import. What it has brought in stays, and it can go on later
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Stopped }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/admin/imports:
    get:
      operationId: listImports
      summary: Imports, the newest first
      responses:
        "200":
          description: The imports
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ImportEntry" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createImport
      summary: Bring a library in from Immich, Google Takeout or an iCloud export
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportCreate" }
      responses:
        "201":
          description: Started
          content:
            application/json:
              schema: { type: object, additionalProperties: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/admin/imports/{id}/cancel:
    post:
      operationId: cancelImport
      summary: Stop an import. What it has brought in stays
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Stopped }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/features:
    get:
      operationId: getFeatures
      summary: Which additions the administrator has turned on
      responses:
        "200":
          description: Each feature and whether it is on
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Features" }
        "401": { $ref: "#/components/responses/Error" }
  /api/admin/features/{name}:
    put:
      operationId: setFeature
      summary: Turn an addition on or off
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeatureUpdate" }
      responses:
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/admin/backup:
    get:
      operationId: getBackupSettings
      summary: Where backups go, without any secret
      responses:
        "200":
          description: The settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupSettings" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      operationId: setBackupSettings
      summary: Change where backups go. A secret left out stays as it was
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupSettingsUpdate" }
      responses:
        "200":
          description: The settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupSettings" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
